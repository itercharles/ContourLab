# Every published port is bound to 127.0.0.1: the system is used from the workstation it runs on.
# The API and the repository have no authentication, so neither may
# be reachable from the network. To open the client to other computers, put an authenticating
# reverse proxy in front of it rather than changing these bindings.
services:
  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    image: webtps-client:latest
    container_name: webtps-client
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: webtps-api:latest
    container_name: webtps-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:4000
      GITHUB_TOKEN: ${ISSUES_TOKEN}
    ports:
      - "127.0.0.1:4001:4000"
    restart: unless-stopped

  dicom-repo:
    # Pinned by tag and digest: a moving tag would change the repository software on a redeploy without anyone
    # deciding it. To upgrade, change both files together, back up first (scripts/deploy/backup-orthanc.sh),
    # and record the new version in the SOUP register.
    image: orthancteam/orthanc:26.1.0@sha256:a055ccd31f7cd1e45ce98912e1c6e8e83b6a8f262f5b8fe6c88e2b6cd060fc57
    container_name: webtps-orthanc
    ports:
      - "127.0.0.1:8042:8042"
      - "127.0.0.1:4242:4242"
    volumes:
      - ./docker/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ${CONTOURLAB_ORTHANC_DATA_DIR:-./deploy-data/orthanc-db}:/var/lib/orthanc/db
    restart: unless-stopped
