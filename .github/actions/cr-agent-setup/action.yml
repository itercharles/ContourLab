name: CR Agent Setup
description: medharness + Node + Claude Code for CR lifecycle jobs.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/medharness-setup

    - uses: actions/cache@v5
      with:
        path: ~/.npm
        key: npm-claude-code-${{ runner.os }}

    - uses: actions/setup-node@v6
      with:
        node-version: '22'

    # Pinned: this job holds ACTIONS_PAT and the model key and runs the CLI on repository contents, so a
    # new release must not arrive by itself. 2.1.300 is the release that generated CR-020 and CR-021 (the
    # newest on npm when they ran). To upgrade, change the version below and run a CR through design
    # and code before relying on it.
    - name: Install Claude Code
      shell: bash
      env:
        CLAUDE_CODE_VERSION: '2.1.300'
      run: |
        npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
        installed="$(claude --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
        if [ "$installed" != "$CLAUDE_CODE_VERSION" ]; then
          echo "::error::expected Claude Code $CLAUDE_CODE_VERSION, found '$installed'"
          exit 1
        fi

    # build plan/build code --pr commit and push their own work.
    - name: Configure git identity
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Trust Claude Code workspace on runner
      shell: bash
      run: |
        SETTINGS="$HOME/.claude.json"
        PROJ="/home/runner/work/ContourLab/ContourLab"
        if [ -f "$SETTINGS" ]; then
          tmp=$(mktemp)
          jq --arg p "$PROJ" '.projects[$p].hasTrustDialogAccepted = true' "$SETTINGS" > "$tmp" && mv "$tmp" "$SETTINGS"
        else
          mkdir -p "$(dirname "$SETTINGS")"
          printf '{"projects":{"%s":{"hasTrustDialogAccepted":true}}}\n' "$PROJ" > "$SETTINGS"
        fi
