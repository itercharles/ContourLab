name: Complete CR In DHF

run-name: CR completion | #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  complete-cr:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'feat/CR-')
    runs-on: ${{ vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON != '' && fromJSON(vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON) || fromJSON('["ubuntu-latest"]') }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.ACTIONS_PAT }}
          fetch-depth: 0

      - uses: ./.github/actions/medharness-setup

      - name: Complete CR
        id: complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          CR_ID=$(echo "$BRANCH" | grep -oE 'CR-[0-9]+')
          if [ -z "$CR_ID" ]; then
            echo "::error::Could not extract CR ID from branch $BRANCH" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          dhfkit --dhf DHF item transition "$CR_ID" completed
          git add DHF/
          if ! git diff --staged --quiet; then
            BRANCH_NAME="chore/complete-$CR_ID"
            git checkout -b "$BRANCH_NAME"
            git commit -m "chore: complete $CR_ID"
            git push origin "$BRANCH_NAME"
            gh pr create --base main --head "$BRANCH_NAME" \
              --title "chore: complete $CR_ID" \
              --body "Lifecycle transition to completed for $CR_ID, merged via PR #${{ github.event.pull_request.number }}."
          fi

  closure-gate:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'feat/CR-')
    runs-on: ${{ vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON != '' && fromJSON(vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON) || fromJSON('["ubuntu-latest"]') }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/medharness-setup

      - name: Download test evidence from latest CI run
        # Artifacts live in ci-pipeline.yml, not in this workflow. Fetch from
        # the most recent successful ci-pipeline run on main.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list \
            --workflow ci-pipeline.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            -q '.[0].databaseId' 2>/dev/null || true)
          mkdir -p test-results/srs test-results/srs-api test-results/sys
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" -n verify-srs-junit     -D test-results/srs/     2>/dev/null || true
            gh run download "$RUN_ID" -n verify-srs-api-junit -D test-results/srs-api/ 2>/dev/null || true
            gh run download "$RUN_ID" -n verify-sys-junit     -D test-results/sys/     2>/dev/null || true
            echo "Downloaded test evidence from ci-pipeline run $RUN_ID"
          else
            echo "No successful ci-pipeline run found — closure gate will check structural completeness only"
          fi

      - name: Run CR closure gate
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          CR_ID=$(echo "$BRANCH" | grep -oE 'CR-[0-9]+')
          medharness --dhf DHF verify completion \
            --cr "$CR_ID" \
            --junit test-results/srs \
            --junit test-results/srs-api \
            --junit test-results/sys
