name: Complete CR In DHF

run-name: CR completion | #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  complete-cr:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'feat/CR-')
    runs-on: ${{ vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON != '' && fromJSON(vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON) || fromJSON('["ubuntu-latest"]') }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.ACTIONS_PAT }}
          fetch-depth: 0

      - uses: ./.github/actions/medharness-setup

      - name: Complete CR
        id: complete
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          CR_ID=$(echo "$BRANCH" | grep -oE 'CR-[0-9]+')
          if [ -z "$CR_ID" ]; then
            echo "::error::Could not extract CR ID from branch $BRANCH" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          dhfkit --dhf DHF item transition "$CR_ID" completed
          git add DHF/
          if ! git diff --staged --quiet; then
            BRANCH_NAME="chore/complete-$CR_ID"
            git checkout -b "$BRANCH_NAME"
            git commit -m "chore: complete $CR_ID"
            git push origin "$BRANCH_NAME"
            gh pr create --base main --head "$BRANCH_NAME" \
              --title "chore: complete $CR_ID" \
              --body "Lifecycle transition to completed for $CR_ID, merged via PR #${{ github.event.pull_request.number }}."
          fi
