name: SOUP Sync

on:
  workflow_dispatch:
    inputs:
      write:
        description: 'Apply creates/updates to DHF (dry-run if unchecked)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 09:00 UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  soup-sync:
    name: Sync SOUP items with package manifests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.ACTIONS_PAT }}

      - uses: ./.github/actions/medharness-setup

      - name: Sync SOUP items
        id: sync
        run: |
          WRITE_FLAG=${{ inputs.write == true && '--write' || '' }}
          medharness --dhf DHF build dhf \
            --manifest requirements.txt \
            --manifest package.json \
            --manifest apps/client/package.json \
            --manifest packages/shared-types/package.json \
            $WRITE_FLAG \
            | tee /tmp/soup-sync-out.json

      - name: Open a pull request for the SOUP changes
        if: ${{ inputs.write == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DHF/
          if ! git diff --staged --quiet; then
            BRANCH="chore/soup-sync-${{ github.run_id }}"
            git checkout -b "$BRANCH"
            git commit -m "chore: update SOUP items from manifests"
            git push origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "chore: update SOUP items from manifests" \
              --body "SOUP register reconciled by \`medharness build dhf --write\`."
          else
            echo "No DHF changes to commit."
          fi
