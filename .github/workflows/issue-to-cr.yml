name: ContourLab CR Issue Intake

run-name: "CR Issue Intake | #${{ github.event.issue.number }} | ${{ github.event.issue.title }}"

on:
  issues:
    types: [milestoned]

concurrency:
  group: issue-to-cr-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  # Intake holds the PAT and runs no agent: it records the CR, pushes the branch and opens the PR. The design
  # is generated by create-cr-design, which has no credential that can push (see cr-lifecycle.yml for the
  # handoff), and pushed by create-cr-design-push. The branch is pushed here, before the agent exists, so the
  # PR is there even if the design fails and the later push is an ordinary fast-forward.
  create-cr:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ${{ vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON != '' && fromJSON(vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON) || fromJSON('["ubuntu-latest"]') }}
    permissions:
      contents: read   # the push is made with the PAT the checkout holds
      issues: write
      pull-requests: write
    outputs:
      cr_id: ${{ steps.prepare.outputs.cr_id }}
      pr_number: ${{ steps.open_pr.outputs.pr_number }}
      opened: ${{ steps.open_pr.outcome }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.ACTIONS_PAT }}
          fetch-depth: 0

      - uses: ./.github/actions/medharness-setup

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare CR from issue
        id: prepare
        # Event fields go through the environment: interpolated into the script, a title
        # containing a quote or $(...) would be run as shell.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REQUESTED_BY: ${{ github.event.issue.user.login }}
          MILESTONE: ${{ github.event.issue.milestone.title }}
        run: |
          ISSUE_BODY=$(gh issue view "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" --json body --jq '.body // ""')

          DESCRIPTION=$(printf '%s\n\nSource issue: %s' "$ISSUE_BODY" "$ISSUE_URL")
          DATA=$(jq -n \
            --arg title "$ISSUE_TITLE" \
            --arg description "$DESCRIPTION" \
            --arg requested_by "$REQUESTED_BY" \
            --arg target_version "$MILESTONE" \
            '{title: $title, description: $description, requested_by: $requested_by,
              priority: "Medium", status: "new", target_version: $target_version}')

          # A CR that was cancelled (its PR closed unmerged) is not recorded on main, so its number is free
          # as far as the DHF can tell, while its feat/CR-N branch may still be on the remote. Reusing the
          # number would force-push over that branch, so such numbers are skipped; the files made for them
          # are removed again below.
          branch_taken() {
            git remote get-url origin > /dev/null 2>&1 && git ls-remote --exit-code --heads origin "feat/$1" > /dev/null 2>&1
          }
          SKIPPED_FILES=""
          CR_ID=""
          for _ in $(seq 1 25); do
            RESULT=$(medharness --dhf DHF item create --type CR --data "$DATA")
            CR_ID=$(echo "$RESULT" | jq -r '.id // ""')
            if [ -z "$CR_ID" ] || [ "$CR_ID" = "null" ]; then break; fi
            if branch_taken "$CR_ID"; then
              echo "::notice::feat/$CR_ID already exists on the remote; using the next CR number"
              SKIPPED_FILES="$SKIPPED_FILES $(medharness --dhf DHF item get "$CR_ID" | jq -r '.file_path // empty')"
              CR_ID=""
              continue
            fi
            break
          done
          for skipped in $SKIPPED_FILES; do rm -f "$skipped"; done
          if [ -z "$CR_ID" ] || [ "$CR_ID" = "null" ]; then
            echo "::error::Failed to create CR item" >&2
            echo "should_create=false" >> "$GITHUB_OUTPUT"
            echo "reason=CR item creation failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "{\"cr_id\": \"$CR_ID\"}" > /tmp/issue-to-cr.json
          echo "cr_id=$CR_ID" >> "$GITHUB_OUTPUT"
          echo "should_create=true" >> "$GITHUB_OUTPUT"
          cat /tmp/issue-to-cr.json

      - name: Stop when issue is not ready for CR intake
        if: steps.prepare.outputs.should_create != 'true'
        run: echo "${{ steps.prepare.outputs.reason }}"

      - name: Create stage labels
        if: steps.prepare.outputs.should_create == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "cr:stage/design"    --color "d93f0b" --description "CR stage: awaiting design review" 2>/dev/null || true
          gh label create "cr:stage/code"      --color "0e8a16" --description "CR stage: awaiting code review"   2>/dev/null || true
          gh label create "cr-design-approved" --color "0075ca" --description "CR design generation complete"    2>/dev/null || true

      # Push the CR commit before design generation so a branch + PR always
      # exists even if generate-dhf later fails — enabling manual rerun.
      - name: Create feat branch, commit CR, push
        id: create_branch
        if: steps.prepare.outputs.should_create == 'true'
        run: |
          CR_ID=$(jq -r '.cr_id' /tmp/issue-to-cr.json)
          git checkout -b "feat/$CR_ID"
          git add DHF/items/
          git commit -m "cr: intake $CR_ID"
          git push --force-with-lease --set-upstream origin "feat/$CR_ID"

      - name: Open draft PR
        id: open_pr
        if: steps.create_branch.outcome == 'success'
        # The workflow token opens the PR, so the bot is its author and the maintainer
        # can request changes and approve it (GitHub bars an author from reviewing their
        # own PR). CI still runs: the branch was pushed with the PAT, and so is every
        # later commit. The PAT cannot edit issues either.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          CR_ID=$(jq -r '.cr_id' /tmp/issue-to-cr.json)
          BRANCH="feat/$CR_ID"
          {
            echo "Closes #${{ github.event.issue.number }}"
            echo ""
            echo "**How this CR moves.** A progress checklist comment on this PR shows the six steps, which one is current and, when it is your turn, what to do."
            echo "You act at three points: approve the design, approve the code, merge this PR. Everything else is automatic, including recording the CR as completed."
          } > /tmp/pr-body.md
          PR_URL=$(gh pr view "$BRANCH" --json url,state -q 'select(.state=="OPEN") | .url' 2>/dev/null || true)
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --head "$BRANCH" \
              --base main \
              --draft \
              --title "feat($CR_ID): $ISSUE_TITLE" \
              --body-file /tmp/pr-body.md \
              --label "cr:stage/design")
          fi
          gh issue edit "${{ github.event.issue.number }}" --add-label "cr:stage/design"
          PR_NUMBER=$(gh pr view "$BRANCH" --json number --jq '.number' 2>/dev/null || echo "")
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          {
            echo "CR intake complete: **$CR_ID** — design generating, review PR: $PR_URL"
            echo ""
            echo "<!-- contourlab-cr: $CR_ID -->"
            echo "<!-- contourlab-cr-pr: $PR_URL -->"
          } | gh issue comment "${{ github.event.issue.number }}" --body-file -

      - name: "Show progress: generating the design"
        if: steps.open_pr.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/cr-progress
        with:
          pr: ${{ steps.open_pr.outputs.pr_number }}
          cr: ${{ steps.prepare.outputs.cr_id }}
          stage: design-generating

  create-cr-design:
    needs: [create-cr]
    if: needs.create-cr.outputs.opened == 'success'
    name: Generate the design for the new CR
    runs-on: ${{ vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON != '' && fromJSON(vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON) || fromJSON('["ubuntu-latest"]') }}
    permissions:
      contents: read
      pull-requests: write   # the failure comment and the cr-progress comment
    outputs:
      has_commits: ${{ steps.handoff.outputs.has-commits }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feat/${{ needs.create-cr.outputs.cr_id }}
          persist-credentials: false

      - uses: ./.github/actions/cr-agent-setup
      - uses: ./.github/actions/cr-handoff-prepare

      - name: Generate design
        id: generate_design
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.CR_DESIGN_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ needs.create-cr.outputs.cr_id }}
        run: |
          set -o pipefail
          # No --pr here: passing --pr switches generate-dhf into revision mode
          # (reads PR review feedback), which is wrong on a brand-new draft PR.
          # Revision mode is only used by cr-lifecycle.yml revise-design.
          python -m medharness --dhf DHF build plan --cr "$CR_ID" | tee /tmp/generate-dhf-out.json

      - name: Post design failure comment
        if: always() && steps.generate_design.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ needs.create-cr.outputs.cr_id }}
          PR_NUMBER: ${{ needs.create-cr.outputs.pr_number }}
        run: |
          ERRORS=$(jq -r '.errors[]? | "- **\(.field)**: \(.issue)\n  _Fix:_ \(.fix)"' /tmp/generate-dhf-out.json 2>/dev/null || echo "")
          # 0.67.0: a CR the model rejects at triage makes build plan exit non-zero with outcome "rejected".
          # Re-running the design cannot help, so say so instead of offering to re-trigger it.
          REJECTED=$(jq -r 'select(.outcome == "rejected") | (.errors[0].issue // "The model rejected the change request at triage.")' /tmp/generate-dhf-out.json 2>/dev/null || echo "")
          if [ -n "$REJECTED" ]; then
            BODY=$(printf '🚫 **%s was rejected at triage.**\n\n%s\n\nNothing is recorded in the DHF. To go on, close this PR, or reword the issue and set its milestone again (the new CR takes the next free number).' "$CR_ID" "$REJECTED")
          elif [ -n "$ERRORS" ]; then
            BODY=$(printf '⚠️ **Design validation has residual errors** for %s:\n\n%s\n\nCorrect the DHF items and re-trigger via Actions → cr-lifecycle.yml → workflow_dispatch (stage: design).' "$CR_ID" "$ERRORS")
          else
            BODY="⚠️ **Design generation failed** for $CR_ID — re-trigger via Actions → cr-lifecycle.yml → workflow_dispatch (stage: design) once the cause is resolved."
          fi
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$BODY" || true
          exit 1

      - name: "Show progress: design generation failed"
        if: always() && steps.generate_design.outcome != 'success'
        continue-on-error: true
        uses: ./.github/actions/cr-progress
        with:
          pr: ${{ needs.create-cr.outputs.pr_number }}
          cr: ${{ needs.create-cr.outputs.cr_id }}
          stage: failed
          failed-at: '1'
          detail: 'Design generation failed. The reason is in the comment above and in the run log behind the link below.'

      - name: Commit design
        if: steps.generate_design.outcome == 'success'
        env:
          CR_ID: ${{ needs.create-cr.outputs.cr_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$(medharness --dhf DHF item get "$CR_ID" | jq -r .status)" = "new" ]; then
            medharness --dhf DHF item transition "$CR_ID" design
          fi
          git add DHF/
          if ! git diff --staged --quiet; then
            # What this run staged; files_changed/items_changed span the whole branch.
            COMMIT_BODY="$(git diff --cached --stat | tail -1)"
            if [ -f /tmp/generate-dhf-out.json ]; then
              COMMIT_BODY="${COMMIT_BODY}"$'\n'"Outcome: $(jq -r '.outcome // "unknown"' /tmp/generate-dhf-out.json)"
            fi
            if [ -n "$COMMIT_BODY" ]; then
              git commit -m "feat: design $CR_ID" -m "$COMMIT_BODY"
            else
              git commit -m "feat: design $CR_ID"
            fi
            git push   # to the local handoff repository
          fi

      # The plan is read here, from the committed tree, because the push job has no medharness and a tree
      # from before the push.
      - name: Collect the implementation plan
        if: steps.generate_design.outcome == 'success'
        env:
          CR_ID: ${{ needs.create-cr.outputs.cr_id }}
        run: |
          CR_JSON=$(medharness --dhf DHF item get "$CR_ID") || { echo "::warning::medharness item get $CR_ID failed, skipping plan comment"; exit 0; }
          echo "$CR_JSON" | jq -r '(.implementation_notes // "") | ltrimstr("\n") | rtrimstr("\n")' > /tmp/cr-plan.md

      - name: Upload design payload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: medharness-generate-dhf-intake-${{ github.run_id }}
          path: |
            /tmp/generate-dhf-out.json
            /tmp/cr-plan.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Hand over the new commits
        id: handoff
        if: steps.generate_design.outcome == 'success'
        uses: ./.github/actions/cr-handoff-bundle
        with:
          name: cr-handoff-create-cr-design-${{ github.run_id }}-${{ github.run_attempt }}

  create-cr-design-push:
    needs: [create-cr, create-cr-design]
    name: Push the design for the new CR
    runs-on: ${{ vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON != '' && fromJSON(vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON) || fromJSON('["ubuntu-latest"]') }}
    permissions:
      contents: read   # the push is made with the PAT the checkout holds
      pull-requests: write
    steps:
      # The PAT, not the workflow token: a commit pushed with the workflow token starts no CI run.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PAT }}
          ref: feat/${{ needs.create-cr.outputs.cr_id }}

      - name: Push the design
        if: needs.create-cr-design.outputs.has_commits == 'true'
        uses: ./.github/actions/cr-handoff-push
        with:
          name: cr-handoff-create-cr-design-${{ github.run_id }}-${{ github.run_attempt }}
          branch: feat/${{ needs.create-cr.outputs.cr_id }}

      - name: Download design payload
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: medharness-generate-dhf-intake-${{ github.run_id }}
          path: ${{ runner.temp }}/payload

      - name: Mark design generated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.create-cr.outputs.pr_number }}
        run: |
          gh pr edit "$PR_NUMBER" --add-label "cr-design-approved"

      - name: Post design summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ needs.create-cr.outputs.cr_id }}
          PR_NUMBER: ${{ needs.create-cr.outputs.pr_number }}
          PAYLOAD: ${{ runner.temp }}/payload/generate-dhf-out.json
        run: |
          [ ! -f "$PAYLOAD" ] && exit 0
          CREATED=$(jq -r '[.artifacts.items_changed.created[]?] | join(", ")' "$PAYLOAD")
          UPDATED=$(jq -r '[.artifacts.items_changed.updated[]?] | join(", ")' "$PAYLOAD")
          DESIGN_SUMMARY=$(jq -r '.summary // ""' "$PAYLOAD")
          BODY="**Design output for $CR_ID**"$'\n'
          [ -n "$DESIGN_SUMMARY" ] && BODY="${BODY}"$'\n'"$DESIGN_SUMMARY"$'\n'
          [ -n "$CREATED" ] && BODY="${BODY}"$'\n'"**Created on the branch:** $CREATED"$'\n'
          [ -n "$UPDATED" ] && BODY="${BODY}"$'\n'"**Updated on the branch:** $UPDATED"$'\n'
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "$BODY"

      - name: Post implementation plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.create-cr.outputs.pr_number }}
          PLAN: ${{ runner.temp }}/payload/cr-plan.md
        run: |
          [ ! -f "$PLAN" ] && exit 0
          IMPL_NOTES=$(cat "$PLAN")
          [ -z "$IMPL_NOTES" ] && exit 0
          BODY=$(printf '## Implementation Plan\n\n%s' "$IMPL_NOTES")
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "$BODY"

      - name: "Show progress: design ready for review"
        if: success()
        continue-on-error: true
        uses: ./.github/actions/cr-progress
        with:
          pr: ${{ needs.create-cr.outputs.pr_number }}
          cr: ${{ needs.create-cr.outputs.cr_id }}
          stage: design-review

      - name: "Show progress: pushing the design failed"
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/cr-progress
        with:
          pr: ${{ needs.create-cr.outputs.pr_number }}
          cr: ${{ needs.create-cr.outputs.cr_id }}
          stage: failed
          failed-at: '1'
          detail: 'Pushing the generated design failed. The reason is in the run log behind the link below.'
