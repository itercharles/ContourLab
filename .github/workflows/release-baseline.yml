name: Release Baseline

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string
      write:
        description: 'Create REL item in DHF'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release-baseline:
    name: Build IEC 62304 §9 release baseline
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.ACTIONS_PAT }}

      - uses: ./.github/actions/medharness-setup

      - name: Build release baseline
        run: |
          mkdir -p artifacts
          WRITE_FLAG=${{ inputs.write == true && '--write' || '' }}
          medharness --dhf DHF build release \
            --version "${{ inputs.version }}" \
            --manifest requirements.txt \
            --manifest package.json \
            --manifest apps/client/package.json \
            --manifest packages/shared-types/package.json \
            --out-dir artifacts \
            $WRITE_FLAG \
            | tee /tmp/release-baseline-out.json

      - name: Upload baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-baseline-${{ inputs.version }}
          path: artifacts/
          retention-days: 90

      - name: Open a pull request for the REL item
        if: ${{ inputs.write == true }}
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DHF/
          if ! git diff --staged --quiet; then
            BRANCH="chore/release-$VERSION"
            git checkout -b "$BRANCH"
            git commit -m "chore: release $VERSION"
            git push origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "chore: release $VERSION" \
              --body "REL item and software BOM for $VERSION, written by \`medharness build release --write\`. Artifacts are attached to the workflow run."
          else
            echo "No DHF changes to commit."
          fi
