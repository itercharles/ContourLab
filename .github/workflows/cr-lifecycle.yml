name: ContourLab CR Lifecycle

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
    && format('{0} | re-run stage:{1}', inputs.cr_id, inputs.stage)
    || format('CR lifecycle | {0} | {1}',
        github.event.pull_request.head.ref,
        github.event.review.state || (github.event.pull_request.merged == true && 'merged' || 'closed')) }}

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      cr_id:
        description: 'CR ID (e.g. CR-034)'
        required: true
        type: string
      stage:
        description: 'Stage to re-run'
        required: true
        type: choice
        options: [design, code]

concurrency:
  group: cr-lifecycle-${{ github.event.pull_request.number || inputs.cr_id }}
  cancel-in-progress: true

# ── DETECT ────────────────────────────────────────────────────────────────────
# Determines what action to take and passes context to downstream jobs.
# action values: gen-design | gen-code | code-approved |
#                revise-design | revise-code |
#                cancel | noop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  detect:
    if: |
      (startsWith(github.event.pull_request.head.ref, 'feat/CR-') &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON != '' && fromJSON(vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON) || fromJSON('["ubuntu-latest"]') }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      cr_id: ${{ steps.plan.outputs.cr_id }}
      pr_number: ${{ steps.enrich.outputs.pr_number }}
      branch: ${{ steps.enrich.outputs.branch }}
      issue_number: ${{ steps.enrich.outputs.issue_number }}
    steps:
      # Stage comes from the PR's cr:stage/<stage> label, or the dispatch input.
      - name: Plan lifecycle action
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGED: ${{ github.event.pull_request.merged }}
          INPUT_CR: ${{ inputs.cr_id }}
          INPUT_STAGE: ${{ inputs.stage }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CR_ID="$INPUT_CR"; STAGE="$INPUT_STAGE"
            case "$CR_ID" in
              CR-[0-9]*) ;;
              *) echo "::error::cr_id must look like CR-123, got: $CR_ID"; exit 1 ;;
            esac
            case "$CR_ID" in *[!A-Za-z0-9-]*) echo "::error::cr_id has unexpected characters"; exit 1 ;; esac
          else
            CR_ID=$(echo "$HEAD_REF" | grep -oE 'CR-[0-9]+' || true)
            STAGE=$(jq -r '[.pull_request.labels[].name | select(startswith("cr:stage/")) | ltrimstr("cr:stage/")][0] // ""' "$GITHUB_EVENT_PATH")
          fi

          # An approval of an earlier commit approved work that has since changed.
          # Branch protection (dismiss stale approvals) is the server-side enforcement.
          if [ "$EVENT_NAME" = "pull_request_review" ] && [ "$REVIEW_STATE" = "approved" ] \
             && [ "$REVIEW_COMMIT" != "$HEAD_SHA" ]; then
            echo "approval is of $REVIEW_COMMIT, head is $HEAD_SHA: stale, ignoring"
            REVIEW_STATE="stale"
          fi

          case "$EVENT_NAME:$REVIEW_STATE:$STAGE" in
            workflow_dispatch::design)                 ACTION=gen-code ;;
            workflow_dispatch::code)                   ACTION=code-approved ;;
            pull_request_review:approved:design)       ACTION=gen-code ;;
            pull_request_review:approved:code)         ACTION=code-approved ;;
            pull_request_review:changes_requested:design) ACTION=revise-design ;;
            pull_request_review:changes_requested:code)   ACTION=revise-code ;;
            pull_request::*) [ "$MERGED" = "true" ] && ACTION=noop || ACTION=cancel ;;
            *)                                         ACTION=noop ;;
          esac

          echo "event=$EVENT_NAME review=$REVIEW_STATE stage=$STAGE cr=$CR_ID -> action=$ACTION"
          {
            echo "action=$ACTION"
            echo "cr_id=$CR_ID"
          } >> "$GITHUB_OUTPUT"
          jq -n --arg cr_id "$CR_ID" --arg branch_ref "$HEAD_REF" \
            --arg pr_number "${{ github.event.pull_request.number }}" \
            '{cr_id: $cr_id, branch_ref: $branch_ref, pr_number: $pr_number}' > /tmp/event-plan.json

      - name: Enrich with PR number, branch, and linked issue
        id: enrich
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CR_ID=$(jq -r '.cr_id // ""' /tmp/event-plan.json)
          PR_NUMBER=$(jq -r '.pr_number // ""' /tmp/event-plan.json)
          [ -z "$PR_NUMBER" ] && PR_NUMBER="${{ github.event.pull_request.number }}"
          BRANCH=$(jq -r '.branch_ref // ""' /tmp/event-plan.json)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="feat/$CR_ID"
            PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" \
              --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -z "$PR_NUMBER" ]; then
              echo "ERROR: no open PR found for $BRANCH" >&2
              exit 1
            fi
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          ISSUE_NUMBER=""
          if [ -n "$PR_NUMBER" ]; then
            ISSUE_NUMBER=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
              --json closingIssuesReferences \
              --jq '.closingIssuesReferences[0].number // empty' 2>/dev/null || echo "")
          fi
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"


  # ── CANCEL ────────────────────────────────────────────────────────────────

  cancel-cr:
    needs: [detect]
    if: needs.detect.outputs.action == 'cancel'
    name: "Cancel CR (${{ needs.detect.outputs.cr_id }})"
    runs-on: ${{ vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON != '' && fromJSON(vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON) || fromJSON('["ubuntu-latest"]') }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
      - uses: ./.github/actions/medharness-setup

      - name: Cancel CR
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
          CR_ID: ${{ needs.detect.outputs.cr_id }}
          BRANCH: ${{ needs.detect.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH" --depth 1
          # A CR created by `item create` lands in the default directory (07_cr/), older
          # ones sit in 09_cr/: find the file wherever the branch has it.
          CR_FILE=$(git ls-tree -r --name-only "origin/$BRANCH" -- DHF/items | grep -E "/$CR_ID\.yaml$" | head -1)
          if [ -z "$CR_FILE" ]; then
            echo "::error::$CR_ID has no item file on $BRANCH"
            exit 1
          fi
          git checkout "origin/$BRANCH" -- "$CR_FILE"
          medharness --dhf DHF item transition \
            "$CR_ID" cancelled
          git add DHF/
          if ! git diff --staged --quiet; then
            CANCEL_BRANCH="chore/cancel-$CR_ID"
            git checkout -b "$CANCEL_BRANCH"
            git commit -m "chore: cancel $CR_ID"
            git push origin "$CANCEL_BRANCH"
            gh pr create --base main --head "$CANCEL_BRANCH" \
              --title "chore: cancel $CR_ID" \
              --body "Lifecycle transition to cancelled for $CR_ID after its PR was closed without merging."
          fi

  # ── DESIGN: GENERATE ──────────────────────────────────────────────────────

  gen-design:
    needs: [detect]
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.action == 'gen-design'
    name: "Generate Design (${{ needs.detect.outputs.cr_id }})"
    runs-on: ${{ vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON != '' && fromJSON(vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON) || fromJSON('["ubuntu-latest"]') }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PAT }}
          ref: ${{ needs.detect.outputs.branch }}
      - uses: ./.github/actions/cr-agent-setup
      - name: Generate design
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.CR_DESIGN_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ needs.detect.outputs.cr_id }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
        run: |
          set -o pipefail
          python -m medharness --dhf DHF build plan --cr "$CR_ID" ${PR_NUMBER:+--pr "$PR_NUMBER"} | tee /tmp/generate-dhf-out.json

      - name: Upload design payload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: medharness-generate-dhf-${{ needs.detect.outputs.cr_id }}
          path: /tmp/generate-dhf-out.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit design
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ needs.detect.outputs.cr_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DHF/
          if ! git diff --staged --quiet; then
            # What this run staged; files_changed/items_changed span the whole branch.
            COMMIT_BODY="$(git diff --cached --stat | tail -1)"
            if [ -f /tmp/generate-dhf-out.json ]; then
              COMMIT_BODY="${COMMIT_BODY}"$'\n'"Outcome: $(jq -r '.outcome // "unknown"' /tmp/generate-dhf-out.json)"
            fi
            if [ -n "$COMMIT_BODY" ]; then
              git commit -m "feat: design $CR_ID" -m "$COMMIT_BODY"
            else
              git commit -m "feat: design $CR_ID"
            fi
          fi
          # The agent may have committed its own work; push whatever is ahead.
          if [ "$(git rev-list --count "origin/$(git rev-parse --abbrev-ref HEAD)..HEAD")" -gt 0 ]; then
            git push
          fi

      - name: Post design summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ needs.detect.outputs.cr_id }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
        run: |
          [ ! -f /tmp/generate-dhf-out.json ] && exit 0
          CREATED=$(jq -r '[.artifacts.items_changed.created[]?] | join(", ")' /tmp/generate-dhf-out.json)
          UPDATED=$(jq -r '[.artifacts.items_changed.updated[]?] | join(", ")' /tmp/generate-dhf-out.json)
          DELETED=$(jq -r '[.artifacts.items_changed.deleted[]?] | join(", ")' /tmp/generate-dhf-out.json)
          SUMMARY=$(jq -r '.summary // ""' /tmp/generate-dhf-out.json)
          BODY="**Design output for $CR_ID**"$'\n'
          [ -n "$SUMMARY" ] && BODY="${BODY}"$'\n'"$SUMMARY"$'\n'
          [ -n "$CREATED" ] && BODY="${BODY}"$'\n'"**Created on the branch:** $CREATED"$'\n'
          [ -n "$UPDATED" ] && BODY="${BODY}"$'\n'"**Updated on the branch:** $UPDATED"$'\n'
          [ -n "$DELETED" ] && BODY="${BODY}"$'\n'"**Deleted on the branch:** $DELETED"$'\n'
          BODY="${BODY}"$'\n'"The implementation plan is in the CR's \`implementation_notes\` (\`medharness item get $CR_ID\`)."
          gh pr comment "$PR_NUMBER" --body "$BODY"

      - name: Validate DHF traceability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ needs.detect.outputs.cr_id }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
        run: |
          if ! python -m medharness --dhf DHF verify dhf --strict; then
            gh pr comment "$PR_NUMBER" \
              --body "⚠️ DHF traceability check failed after design generation for $CR_ID. Correct the DHF items and re-approve to retry."
            exit 1
          fi

      - name: Advance to next review stage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
          ISSUE_NUMBER: ${{ needs.detect.outputs.issue_number }}
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "cr:stage/cr" --add-label "cr:stage/design" 2>/dev/null || true
          [ -n "$ISSUE_NUMBER" ] && gh issue edit "$ISSUE_NUMBER" --remove-label "cr:stage/cr" --add-label "cr:stage/design" 2>/dev/null || true

  # ── DESIGN: REVISE ────────────────────────────────────────────────────────

  revise-design:
    needs: [detect]
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.action == 'revise-design'
    name: "Revise Design (${{ needs.detect.outputs.cr_id }})"
    # Long-running AI generation should stay off the normal CI runner pool so
    # standard PR validation does not queue behind a design revision.
    runs-on: ${{ fromJSON(vars.CONTOURLAB_CODEGEN_RUNS_ON_JSON || '["ubuntu-latest"]') }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PAT }}
          ref: ${{ needs.detect.outputs.branch }}
      - uses: ./.github/actions/cr-agent-setup
      - name: Revise design
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.CR_DESIGN_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ needs.detect.outputs.cr_id }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
        run: |
          set -o pipefail
          python -m medharness --dhf DHF build plan --cr "$CR_ID" --pr "$PR_NUMBER" | tee /tmp/revise-generate-dhf-out.json

      - name: Upload revise-design payload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: medharness-generate-dhf-revise-${{ needs.detect.outputs.cr_id }}-${{ github.run_id }}
          path: /tmp/revise-generate-dhf-out.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ needs.detect.outputs.cr_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DHF/
          if ! git diff --staged --quiet; then
            # What this run staged; files_changed/items_changed span the whole branch.
            COMMIT_BODY="$(git diff --cached --stat | tail -1)"
            if [ -f /tmp/revise-generate-dhf-out.json ]; then
              COMMIT_BODY="${COMMIT_BODY}"$'\n'"Outcome: $(jq -r '.outcome // "unknown"' /tmp/revise-generate-dhf-out.json)"
            fi
            if [ -n "$COMMIT_BODY" ]; then
              git commit -m "feat: revise design $CR_ID" -m "$COMMIT_BODY"
            else
              git commit -m "feat: revise design $CR_ID"
            fi
          fi
          # The agent may have committed its own work; push whatever is ahead.
          if [ "$(git rev-list --count "origin/$(git rev-parse --abbrev-ref HEAD)..HEAD")" -gt 0 ]; then
            git push
          fi

  # ── CODE: GENERATE ────────────────────────────────────────────────────────

  gen-code:
    needs: [detect]
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.action == 'gen-code'
    name: "Generate Code (${{ needs.detect.outputs.cr_id }})"
    # Codegen and the PR CI it waits on cannot share a single-runner pool.
    # Keep the normal CI pool on contourlab-local and route codegen to the
    # separate contourlab-local-codegen pool to avoid deadlock.
    runs-on: ${{ fromJSON(vars.CONTOURLAB_CODEGEN_RUNS_ON_JSON || '["ubuntu-latest"]') }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PAT }}
          ref: ${{ needs.detect.outputs.branch }}
      - uses: ./.github/actions/cr-agent-setup
      # The model is told to run lint, typecheck and the tests (CLAUDE.md, and the typecheck hook in
      # .claude/settings.json). Without pnpm and the workspace dependencies it cannot, and a revision
      # of CR-018 shipped a type error it had no way to see.
      - uses: ./.github/actions/setup-contourlab-frontend
      - name: Generate implementation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.CR_DEVELOP_MODEL }}
          MEDHARNESS_CODE_PATHS: apps/,packages/
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ needs.detect.outputs.cr_id }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
        run: |
          set -o pipefail
          # No --pr: this is fresh generation from the approved design, not a
          # revision of the design reviews, and the job commits and pushes after
          # moving the PR to cr:stage/code so the CI it triggers sees that label.
          python -m medharness --dhf DHF build code --cr "$CR_ID" | tee /tmp/develop-out.json

      - name: Upload develop payload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: medharness-develop-${{ needs.detect.outputs.cr_id }}
          path: /tmp/develop-out.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit implementation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ needs.detect.outputs.cr_id }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$(medharness --dhf DHF item get "$CR_ID" | jq -r .status)" = "design" ]; then
            medharness --dhf DHF item transition "$CR_ID" develop
          fi
          git add -A
          COMMITTED=false
          if ! git diff --staged --quiet; then
            # What this run staged; files_changed/items_changed span the whole branch.
            COMMIT_BODY="$(git diff --cached --stat | tail -1)"
            if [ -f /tmp/develop-out.json ]; then
              COMMIT_BODY="${COMMIT_BODY}"$'\n'"Outcome: $(jq -r '.outcome // "unknown"' /tmp/develop-out.json)"
            fi
            if [ -n "$COMMIT_BODY" ]; then
              git commit -m "feat: implement $CR_ID" -m "$COMMIT_BODY"
            else
              git commit -m "feat: implement $CR_ID"
            fi
            COMMITTED=true
          fi
          # The agent may have committed its own work; that counts too.
          if [ "$(git rev-list --count "origin/$(git rev-parse --abbrev-ref HEAD)..HEAD")" -gt 0 ]; then
            COMMITTED=true
          fi
          git fetch -q origin main
          CODE_EXISTS=$(git diff origin/main -- . \
            ':(exclude)DHF/' \
            | grep -c "^+" || true)
          if [ "$COMMITTED" != "true" ] && [ "$CODE_EXISTS" = "0" ]; then
            gh pr comment "$PR_NUMBER" \
              --body "⚠️ Implementation produced no code changes for $CR_ID — stage not advanced. Re-trigger via Actions → workflow_dispatch (stage: design) and check Claude logs."
            exit 1
          fi
          echo "COMMITTED=$COMMITTED" >> "$GITHUB_ENV"

      - name: Advance to next review stage
        # Advance label BEFORE pushing so the PR-triggered CI run sees cr:stage/code
        # and the stage-gate allows dev tests (lint · typecheck · build) to run.
        if: env.COMMITTED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
          ISSUE_NUMBER: ${{ needs.detect.outputs.issue_number }}
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "cr:stage/design" --add-label "cr:stage/code"
          [ -n "$ISSUE_NUMBER" ] && gh issue edit "$ISSUE_NUMBER" --remove-label "cr:stage/design" --add-label "cr:stage/code" 2>/dev/null || true
          gh pr ready "$PR_NUMBER" 2>/dev/null || true

      - name: Push and wait for CI
        # We push manually here rather than letting the checkout push because
        # we need to watch the resulting CI run.
        if: env.COMMITTED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
          BRANCH: ${{ needs.detect.outputs.branch }}
          CR_ID: ${{ needs.detect.outputs.cr_id }}
        run: |
          LAST_RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow ci-pipeline.yml \
            --branch "$BRANCH" \
            --event pull_request \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId' 2>/dev/null || echo "")
          git push
          RUN_ID=""
          for i in $(seq 1 18); do
            CANDIDATE=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow ci-pipeline.yml \
              --branch "$BRANCH" \
              --event pull_request \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId' 2>/dev/null || echo "")
            if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "$LAST_RUN_ID" ]; then
              RUN_ID="$CANDIDATE"
              break
            fi
            echo "Waiting for CI run to appear... ($i/18)"
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::Timed out waiting for CI run on branch $BRANCH"
            gh pr comment "$PR_NUMBER" \
              --body "⚠️ Timed out waiting for CI pipeline to start for $CR_ID. Check Actions → ci-pipeline.yml on branch \`$BRANCH\`."
            exit 1
          fi
          echo "Watching CI run $RUN_ID..."
          if ! gh run watch "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --exit-status; then
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"
            gh pr comment "$PR_NUMBER" \
              --body "⚠️ CI pipeline failed for $CR_ID. See [CI run]($RUN_URL) for details. Fix failures and re-trigger via workflow_dispatch (stage: design)."
            exit 1
          fi

  # ── CODE: REVISE ──────────────────────────────────────────────────────────

  revise-code:
    needs: [detect]
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.action == 'revise-code'
    name: "Revise Code (${{ needs.detect.outputs.cr_id }})"
    runs-on: ${{ vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON != '' && fromJSON(vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON) || fromJSON('["ubuntu-latest"]') }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PAT }}
          ref: ${{ needs.detect.outputs.branch }}
      - uses: ./.github/actions/cr-agent-setup
      # The model is told to run lint, typecheck and the tests (CLAUDE.md, and the typecheck hook in
      # .claude/settings.json). Without pnpm and the workspace dependencies it cannot, and a revision
      # of CR-018 shipped a type error it had no way to see.
      - uses: ./.github/actions/setup-contourlab-frontend
      - name: Revise implementation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.CR_DEVELOP_MODEL }}
          MEDHARNESS_CODE_PATHS: apps/,packages/
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ needs.detect.outputs.cr_id }}
          PR_NUMBER: ${{ needs.detect.outputs.pr_number }}
        run: |
          set -o pipefail
          python -m medharness --dhf DHF build code --cr "$CR_ID" --pr "$PR_NUMBER" | tee /tmp/revise-code-out.json

      - name: Upload revise-code payload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: medharness-develop-revise-${{ needs.detect.outputs.cr_id }}-${{ github.run_id }}
          path: /tmp/revise-code-out.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ needs.detect.outputs.cr_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            # What this run staged; files_changed/items_changed span the whole branch.
            COMMIT_BODY="$(git diff --cached --stat | tail -1)"
            if [ -f /tmp/revise-code-out.json ]; then
              COMMIT_BODY="${COMMIT_BODY}"$'\n'"Outcome: $(jq -r '.outcome // "unknown"' /tmp/revise-code-out.json)"
            fi
            if [ -n "$COMMIT_BODY" ]; then
              git commit -m "fix: revise implementation $CR_ID" -m "$COMMIT_BODY"
            else
              git commit -m "fix: revise implementation $CR_ID"
            fi
          fi
          # The agent may have committed its own work; push whatever is ahead.
          if [ "$(git rev-list --count "origin/$(git rev-parse --abbrev-ref HEAD)..HEAD")" -gt 0 ]; then
            git push
          fi

  # ── CODE: APPROVED → READY TO MERGE ──────────────────────────────────────

  code-approved:
    needs: [detect]
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.action == 'code-approved'
    name: "Code Approved — Ready to Merge"
    runs-on: ${{ vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON != '' && fromJSON(vars.CONTOURLAB_DEFAULT_RUNS_ON_JSON) || fromJSON('["ubuntu-latest"]') }}
    permissions:
      pull-requests: write
    steps:
      - name: Comment ready to merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ needs.detect.outputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --body "All stages complete — ready to merge."
