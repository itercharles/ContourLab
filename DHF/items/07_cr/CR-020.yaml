    (submit form + list of CRs via /api/issues). B: they are external links (target
    _blank, rel noopener noreferrer) to the GitHub new-issue page of itercharles/ContourLab;
    /issues route, Issues page and the issues API are removed (acceptance criterion:
    no self-maintained CR creation page). Monitoring list is removed too, since GitHub
    itself shows issues.'
  - The new-issue URL is https://github.com/itercharles/ContourLab/issues/new/choose
    so the existing change_request.yml template is offered; /issues/new?template=change_request.yml
    is equivalent.
