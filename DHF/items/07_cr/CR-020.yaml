implementation_notes: '## Overview

  Replace the in-app Change Requests page with an external hyperlink to the GitHub
  new-issue page, opened in a new tab, and delete the page and its backend.


  ## Current State

  - apps/client/src/components/viewer/Toolbar.tsx (~line 461): react-router `Link
  to="/issues" reloadDocument` labelled ''Change Requests''. CONTOURLAB_REPO_URL constant
  already exists (line 24).

  - apps/client/src/components/layout/LeftSidebar.tsx (~line 122): `Link to="/issues"`
  with title/aria-label ''Change Requests''.

  - apps/client/src/App.tsx: route /issues -> pages/Issues.tsx (submit form + CR list).

  - apps/api/Controllers/IssuesController.cs, Services/GitHubService.cs (+ DI/config
  in Program.cs), apps/api.tests/IssuesEndpointTests.cs.

  - releaseNotesData.ts lists ''Issues and change request tracking page'' (historical
  entry, leave).

  - MODULE-010 already updated in DHF by the design step.


  ## Changes Required

  - Toolbar.tsx: replace Link with `<a href={`${CONTOURLAB_REPO_URL}/issues/new/choose`}
  target="_blank" rel="noopener noreferrer">`, keep Tailwind styling, add a small
  external-link icon, title ''Report a bug or request a change on GitHub (opens in
  a new tab)''. Modify.

  - LeftSidebar.tsx: same anchor, aria-label ''Change Requests (opens GitHub in a
  new tab)''. Modify.

  - App.tsx: remove Issues import and /issues route. Modify.

  - Delete apps/client/src/pages/Issues.tsx and Issues.test.tsx.

  - Delete IssuesController.cs, GitHubService.cs (if used only by it), their registration,
  config keys, and apps/api.tests/IssuesEndpointTests.cs; remove unused client helpers/types
  for /api/issues and check docs/README for mentions.

  - Share the URL constant (export from one place) rather than duplicating it.


  ## Implementation Steps

  1. Add the external anchors in Toolbar and LeftSidebar; update their tests.

  2. Remove route, page and test.

  3. Remove API controller, service, DI, config and tests; `dotnet build apps/api/api.csproj
  -c Release`.

  4. grep for ''/issues'', ''api/issues'', GitHubService for leftovers.

  5. Run client lint, typecheck, tests; `medharness --dhf DHF verify dhf`.


  ## Edge Cases & Constraints

  - Must use rel=noopener noreferrer; no reloadDocument or react-router Link for external
  URL.

  - Unknown /issues URL falls to existing not-found behaviour; confirm no crash.

  - Do not touch DHF/config. Nothing in the clinical workspace may change.

  - Tailwind only, no inline styles, no rounded-xl.


  ## Tests

  No requirement test points change (no @links). Unit: Toolbar and LeftSidebar render
  an anchor with the expected href, target=_blank and rel; no element links to /issues.
  Removed: Issues page and endpoint tests. Manual: click each entry and confirm GitHub
  new-issue page opens in a new tab.'
