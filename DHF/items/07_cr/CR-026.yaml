implementation_notes: '## Overview

  Show the study date of the active image series next to its description in the Image
  field of the workspace context bar, e.g. "CT Pelvis · 2026-03-14".


  ## Current State

  apps/client/src/components/layout/WorkspaceContextBar.tsx renders an Image field
  with activeLoadedSeries?.series.seriesDescription || seriesUID || "No active image
  set". The study date is at activeLoadedSeries.study.studyDate (string, shared-types
  Study; may be YYYYMMDD or YYYY-MM-DD). formatPatientName lives in apps/client/src/core/dicom/patientUtils.ts.
  DicomRepoPanel has a private formatDicomDate.


  ## Changes Required

  - core/dicom/patientUtils.ts (modify): add formatStudyDate(date) returning YYYY-MM-DD
  for 8-digit input, passthrough for already hyphenated input, empty string otherwise.

  - WorkspaceContextBar.tsx (modify): Image field text = label + (date ? " · " + date
  : "") only when a series is active; update the title attribute likewise. No layout/styling
  change (Tailwind only, truncate stays).

  - No shared-types change.


  ## Implementation Steps

  1. Add formatStudyDate with unit tests.

  2. Update the Image field in WorkspaceContextBar.

  3. Add component tests; run client test, lint, typecheck; medharness verify dhf.


  ## Edge Cases & Constraints

  Empty/missing studyDate: no separator. No active series: placeholder only, no date.
  Long descriptions truncate; keep the date visible if practical by rendering the
  date in its own non-truncating span.


  ## Tests

  In WorkspaceContextBar.test.tsx: T1-T3 of SRS-038 with @links:SRS-038 and @testing:Tn
  in names; SYS-012 T2 with @links:SYS-012 @testing:T2 (the no-series case plus an
  active-series case).'
