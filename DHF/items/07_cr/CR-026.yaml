implementation_notes: '## Overview

  Implement the Select tool (rail id ''pointer'', shortcut V). With it active, a click
  on the axial view picks the visible structure under the click and makes it the active
  structure; a click on nothing clears it. Selection never edits contours and works
  in QA.


  ## Current State

  - components/viewer/ToolRail.tsx: TOOL_GROUPS item { id: ''pointer'', name: ''Select'',
  shortcut: ''V'', implemented: false } renders disabled; ''pointer'' is not a ViewerTool.

  - core/store/uiStore.ts: ViewerTool union, setActiveTool; setWorkflowStage resets
  contour tools in QA.

  - core/input/viewerShortcuts.ts: activateTool and the keydown handler have no V
  case.

  - components/viewer/ContourOverlay.tsx: an SVG over each viewport; pointerEvents
  is ''auto'' only for contour-edit tools on AXIAL and measurement tools. It projects
  contours with viewport.worldToCanvas plus canvasMetrics offsets (renderableContours)
  and has getCanvasPoint(event).

  - components/layout/StatusBar.tsx: TOOL_LABELS is a Record<ViewerTool, string>.

  - core/store/structureStore.ts: setActiveStructure(id | null).


  ## Changes Required

  - core/store/uiStore.ts: add ''pointer'' to ViewerTool (not a contour edit tool).

  - core/contouring/structurePicking.ts (new): pure pickStructureAtPoint(candidates,
  point, tolerancePx = 8) where a candidate is { structureId, rings: [number,number][][]
  } in overlay canvas pixels. Nearest outline within tolerance wins; otherwise the
  smallest-area enclosing ring (even-odd point-in-polygon); else null.

  - ContourOverlay.tsx: isSelectTool = activeTool === ''pointer'' && orientation ===
  ''AXIAL''; svg pointerEvents auto for it; handlePointerDown early branch: build
  candidates from visible structures of the active set whose contours are on the current
  frame (isContourOnFrame), projected like renderableContours, call pickStructureAtPoint,
  then setActiveStructure(result). Do not gate on canEditContours.

  - viewerShortcuts.ts: key ''v'' activates ''pointer''; pointer clears the Cornerstone
  primary tool (like contour tools) so left-drag does not also pan or change window/level.

  - ToolRail.tsx: implemented: true, desc ''Click a contour to select its structure'';
  treat ''pointer'' like contour tools for clearPrimaryTool but without the structure-panel
  prompt and allowed in QA.

  - StatusBar.tsx: TOOL_LABELS.pointer = ''Select''.


  ## Implementation Steps

  1. Add ''pointer'' to ViewerTool and StatusBar label; typecheck.

  2. Write structurePicking.ts with tests.

  3. Wire ContourOverlay; test.

  4. Shortcut and ToolRail; tests.


  ## Edge Cases & Constraints

  - Hidden structures (isVisible === false) are never picked.

  - Locked structures can be selected (selection is not an edit).

  - Contours are closed rings; points arrive flattened as [x,y,z,...]; convert via
  worldToOverlayCanvas.

  - MPR views: svg stays pointer-events none; no picking there.

  - Tailwind only, no any.


  ## Tests

  - structurePicking.test.ts: SRS-038 T1, T2.

  - ContourOverlay.test.tsx: SRS-038 T3, T4 (QA stage).

  - viewerShortcuts test: SRS-038 T5; ToolRail enabled in QA.

  '
