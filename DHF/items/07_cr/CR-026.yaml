id: CR-026
title: implement the Select viewer tool
description: '### Requested change


  The Select tool (rail button, shortcut V) is a disabled placeholder. Implement it:
  with Select active, clicking a visible structure contour on the axial view makes
  that structure the active structure (highlighted in the structure panel); clicking
  empty space clears the selection. Works in every workflow stage including QA (selection
  is not an edit). Add the pointer tool to the ViewerTool type, wire the V shortcut
  and the rail button.'
