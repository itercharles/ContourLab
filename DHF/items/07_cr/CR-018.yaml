implementation_notes: '## Overview

  Add a "Back to workspace" link to the header of the Release Notes page (/release-notes)
  navigating to /workspace. Keyboard focusable with visible focus style. Release entries
  and existing header text must not change. Prior attempts (CR-015/016/017) were cancelled;
  this is the same scope.


  ## Current State

  `apps/client/src/pages/ReleaseNotes.tsx` renders a light-theme page (bg-gray-50,
  white header with border-gray-200). Header = `<header className="bg-white border-b
  border-gray-200">` containing `<div className="max-w-5xl mx-auto px-6 py-8">` with
  `h1` "Release Notes" and a subtitle `p`. Data comes from `RELEASE_NOTES` in `./releaseNotesData`.
  The component imports no router code. `ReleaseNotes.test.tsx` has T1/T2 tests, rendering
  `<ReleaseNotes />` without a Router. Route registered in `App.tsx`; sidebar link
  in `LeftSidebar.tsx` uses `reloadDocument`.


  ## Changes Required

  - **apps/client/src/pages/ReleaseNotes.tsx** (modify): import `Link` from `react-router-dom`;
  make the header inner div `flex items-center justify-between`; wrap h1 and p in
  a nested div (text unchanged); add `<Link to="/workspace" reloadDocument ...>Back
  to workspace</Link>` with light-theme classes, e.g. `text-sm font-medium text-blue-600
  hover:text-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500
  focus-visible:ring-offset-2 rounded`. NOTE: the page is light-mode, so do not use
  blue-400/300 (low contrast on white). Use `reloadDocument` to match the sidebar
  links, which leave the page cleanly toward the Cornerstone viewport (check how LeftSidebar
  does it; if tests with MemoryRouter make href assertions awkward, plain Link is
  acceptable).

  - **apps/client/src/pages/ReleaseNotes.test.tsx** (modify): wrap renders in `MemoryRouter`
  (existing T1/T2 tests need it now that Link needs Router context); add T3 and T4
  tests.

  - DHF items SRS-031 and SWDD-013 already updated by this plan. No change to routing,
  sidebar, shared types, release data.


  ## Implementation Steps

  1. Edit ReleaseNotes.tsx as above.

  2. Update test file: MemoryRouter wrapper helper; keep T1/T2.

  3. Add T3 (`@links:SRS-031 @testing:T3`): getByRole(''link'', {name: /back to workspace/i})
  has href ''/workspace'' and className containing `focus-visible:ring`.

  4. Add T4 (`@links:SRS-031 @testing:T4`): h1 text "Release Notes", subtitle "What''s
  changed in each version of ContourLab" present, and each RELEASE_NOTES version rendered
  (count matches).

  5. Run `pnpm --filter @contourlab/client test`, `lint`, `typecheck`.

  6. `medharness --dhf DHF verify dhf` and `verify changes --cr CR-018`.


  ## Edge Cases & Constraints

  - Must be a semantic anchor (Link), not button+useNavigate.

  - Tailwind only, no inline styles, no rounded-xl, no any.

  - Existing header text and entries unchanged.

  - The route is wrapped in a Router in the app (App.tsx); only tests need explicit
  MemoryRouter.

  - No risk, SOUP, security or architecture impact.


  ## Tests

  - Component tests in ReleaseNotes.test.tsx: SRS-031 T3, T4; existing T1, T2 still
  pass (SRS-031/SYS-016).

  - Manual: open /release-notes, Tab to link, see focus ring, activate, land on /workspace.'
