id: CR-028
title: upgrade dcmjs to 0.52.0 (GHSA-px68-xx5g-48q5)
description: '### Requested change


  dcmjs 0.50.1 (SOUP-011), the library that reads and writes the DICOM files the client
  imports and exports (RTSTRUCT, image metadata), has GHSA-px68-xx5g-48q5 (DS/IS value
  representation input validation bypass, low), fixed in 0.52.0. `medharness verify
  soup --strict` fails on it in CI for every pull request.


  Upgrade dcmjs to 0.52.0 (or the newest release that fixes it), update SOUP-011,
  and show that nothing the product relies on changed: RTSTRUCT import and export
  (rtstructImport, rtstructExport), DICOM metadata parsing, and the synthetic phantom
  series round trip against Orthanc (e2e real-dicom). Read the 0.50.1 to 0.52.0 release
  notes for breaking changes (two minor versions of a 0.x library) and record the
  result in the SOUP item''s verification field. Any dcmjs API change that needs product
  code is in scope; no behaviour change is intended.'
