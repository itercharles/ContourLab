implementation_notes: '## Overview

  In the QA workflow stage the contour editing tools must not be displayed, so QA
  is check-only; users switch to the Edit stage to modify contours (issue #202). Adds
  SRS-036, extends SYS-004 (T6), SRS-007, SRS-014, SWDD-001 and SWDD-004.


  ## Current State

  `uiStore.workflowStage` (''auto''|''edit''|''qa''|''review''|''approve'', default
  ''edit'') is set by `setWorkflowStage`, which sets `workflowStage` and switches
  `sidePanelTab`. Contour tools (`edit, freehand, polygon, brush, eraser`) and structure
  operations (`interpolate, margin, boolean`) are listed in `ToolRail.tsx` (groups
  `contour` and `structure`, `CONTOUR_TOOLS`), shown in every stage. `Toolbar.tsx`
  has Undo/Redo, Delete Slice, Fill Gaps, Interpolate. `core/input/viewerShortcuts.ts`
  maps F/D/G/B/E to contour tools through `activateTool`. `ContourOverlay.tsx` captures
  pointer events when `activeTool` is a contour tool. `StructurePanel.tsx` has `handleInterpolateApply`.
  Lock guards (`structureGuard`, `ContourEngine`) are unchanged.


  ## Changes Required

  - **uiStore.ts (modify)**: in `setWorkflowStage`, when stage is ''qa'' set `activeTool=''none''`
  if it is a contour tool and `activeStructureOperationPanel=null`.

  - **ToolRail.tsx (modify)**: when `workflowStage===''qa''` omit the `contour` and
  `structure` groups.

  - **Toolbar.tsx (modify)**: hide Freehand/Polygon/Brush/Eraser, Interpolate, Fill
  Gaps, Delete Slice, Undo, Redo in QA; keep previous/next review navigation.

  - **viewerShortcuts.ts (modify)**: in `activateTool`, return early for `CONTOUR_TOOLS`
  when stage is ''qa''.

  - **StructurePanel.tsx (modify)**: do not render the interpolate-apply action in
  QA.

  - **core/contouring/UndoRedoManager.ts, `installUndoRedoKeyHandler` (modify; installed
  from pages/MainWorkspace.tsx)**: read the stage with `useUIStore.getState()` inside
  the keydown handler (no subscription, so no import cycle) and ignore Cmd/Ctrl+Z
  and Cmd/Ctrl+Shift+Z while `useUIStore.getState().workflowStage===''qa''`.

  - **ToolOptions.tsx (modify)**: render nothing for contour tools in QA (activeTool
  is none after the reset).

  - Optionally export a shared helper (e.g. `isContourEditingAllowed(stage)`) from
  uiStore.ts and use it in all places.

  - Shared types: none.


  ## Implementation Steps

  1. Add the helper and the `setWorkflowStage(''qa'')` reset in uiStore; unit test.

  2. Gate ToolRail and Toolbar rendering; component tests.

  3. Gate shortcuts; test.

  4. Gate StructurePanel interpolate-apply; test.

  5. Run client test, lint, typecheck; `medharness verify dhf`.


  ## Edge Cases & Constraints

  - Switching Edit to QA mid-draft: `setWorkflowStage(''qa'')` sets activeTool to
  none; ContourOverlay holds drafts in `draftPointsRef`/state and are already cleared
  by the `clearDraft()` effect on `isInteractiveTool` (~line 280), so no new code
  is needed once activeTool is reset; add a regression test (SRS-036 T6).

  - Decision: Cmd/Ctrl+Z and Cmd/Ctrl+Shift+Z are blocked in QA and the Undo/Redo
  buttons hidden (SRS-036 T5); the undo stack is kept and works again in Edit.

  - Lock, delete and type changes in StructurePanel are not part of this CR (recorded
  as a follow-up in the product dimension).

  - Review and Approve stages are not changed (follow-up). Measurement and navigation
  tools stay.

  - Tailwind only, no inline styles, text-xs in panels.


  ## Tests

  - uiStore.test.ts: setWorkflowStage(''qa'') resets contour tool and operation panel
  (SRS-036 T3).

  - ToolRail/Toolbar tests: QA hides contour controls, other stages show them (SRS-036
  T1, T4; SYS-004 T6).

  - viewerShortcuts.test.ts: F/D/G/B/E ignored in QA (SRS-036 T2).

  - UndoRedoManager key handler test: Cmd/Ctrl+Z ignored in QA (SRS-036 T5).

  - ContourOverlay test: draft cleared and nothing committed on switch to QA (SRS-036
  T6).

  - StructurePanel test: interpolate-apply absent in QA (SRS-036 T1).

  Name tests with @links:SRS-036 @testing:Tn and @links:SYS-004 @testing:T6.'
