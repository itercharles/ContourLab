impact_analysis:
  assumptions:
  - The home page stage is the workflow stepper in the toolbar (Toolbar.tsx WORKFLOW_STAGES);
    the Approve step is removed so Review is the final stage (01 Auto-segment, 02
    Edit, 03 QA, 04 Review).
  - WorkflowStage loses the approve member; no stage replaces it, so contour editing
    is available in auto, edit and review as before.
  - The side panel Audit tab (RTSTRUCT history, DICOM metadata) and the disabled Approve
    & Sign button in the Review tab are not the stage; they stay. Clicking Audit now
    only switches the panel tab and no longer changes the workflow stage.
  - 'Approve is a UI step only: no DHF requirement defines an approval workflow or
    sign-off, so nothing is lost clinically; removing the disabled Approve & Sign
    button is a follow-up if wanted.'
