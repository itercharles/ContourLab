implementation_notes: '## Overview

  Remove the Approve stage from the workflow stepper on the home page; Review becomes
  the last stage. Approve is the final part of review, so it is not a separate step.
  Requirement: SRS-037 text drops approve from its list of stages; no other DHF item
  names it.


  ## Current State

  apps/client/src/core/store/uiStore.ts: WorkflowStage = auto|edit|qa|review|approve;
  canEditContours(stage) returns stage !== qa; setWorkflowStage co-updates sidePanelTab.
  apps/client/src/components/viewer/Toolbar.tsx: WORKFLOW_STAGES has five entries
  ending { id: approve, num: 05, label: Approve }. apps/client/src/components/structures/StructurePanel.tsx:
  a map from stage to PanelTab (approve: audit) around line 647; the Audit tab button
  calls setWorkflowStage(approve). A disabled Approve & Sign button sits in the Review
  tab. Toolbar.tsx also has an unrelated pipeline description with a trigger string
  approve (GitHub review approval); leave it.


  ## Changes Required

  - uiStore.ts (modify): drop approve from WorkflowStage; remove any approve mapping
  in setWorkflowStage / the stage-to-tab table.

  - Toolbar.tsx (modify): remove the approve entry from WORKFLOW_STAGES.

  - StructurePanel.tsx (modify): remove approve from the stage-to-tab map; make the
  Audit tab button switch only the panel tab (setPanelTab / setSidePanelTab audit),
  not the workflow stage, keeping Audit reachable. Keep the Approve & Sign button
  unless told otherwise.

  - Tests (modify): Toolbar.test.tsx (no 05 Approve tab; remove the click of it near
  line 614), uiStore.test.ts (remove approve rows and from the canEditContours list),
  StructurePanel tests for Audit still pass.

  - Persisted state: grep for stored workflowStage values; a stored approve must fall
  back to edit/review if any persistence exists.


  ## Implementation Steps

  1. Narrow the WorkflowStage type and fix every compile error from pnpm --filter
  @contourlab/client typecheck.

  2. Remove the stepper entry; update the Audit tab handler.

  3. Update tests; run client test, lint, typecheck.

  4. medharness --dhf DHF verify dhf. Run /ux-design before UI work.


  ## Edge Cases & Constraints

  - Audit tab must still open without a stage change; leaving it should not leave
  the stepper with no active stage (stage stays what it was).

  - Tailwind only, no inline styles.

  - Stepper numbering is 01-04.


  ## Tests

  - Toolbar.test.tsx: stepper shows exactly Auto-segment, Edit, QA, Review and no
  Approve (@links:SRS-037).

  - uiStore.test.ts: canEditContours true for auto, edit, review (@links:SRS-037 @testing:T5);
  sidePanelTab mapping for the remaining stages.

  - StructurePanel.test.tsx: Audit tab opens the audit content without changing workflowStage.'
