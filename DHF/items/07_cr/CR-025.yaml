implementation_notes: '## Overview

  Remove the auto-segmentation (auto-contour) feature end to end: the Python TotalSegmentator
  service, its container/volume, the API proxy, the client AI tab and the Auto-segment
  workflow step, the ai-draft structure-set source and the shared types. Saved drafts
  with the old source must still load. The DHF never specified the feature; only wording
  in CRS-015, SYS-018, SRS-006, SRS-037, RISK-010 mentions it, and SRS-035/SWDD-018/SRS-009/SWDD-006
  gain the deploy-cleanup and legacy-source behaviour.


  ## Current State

  - apps/autocontour-service (FastAPI + TotalSegmentator, Dockerfile, tests), port
  4010; docker-compose.deploy.yml services `autocontour-service`, volume `totalseg-models`;
  scripts/deploy/deploy.sh line `up -d --build --no-deps api client autocontour-service`.

  - API: Controllers/AutoContourController.cs, Services/AutoContourServiceClient.cs,
  Models/AutoContourContracts.cs, Program.cs (HttpClient "autocontour", scoped client),
  apps/api.tests/AutoContourEndpointTests.cs.

  - Client: core/autocontour/autocontourClient.ts; StructurePanel.tsx (AI tab, polling,
  handleRunAutoContour, formatSourceLabel ''ai-draft'', Kind/Model/Generated rows,
  setWorkflowStage(''auto'') at ~1448); Toolbar.tsx WORKFLOW_STAGES has {auto,''01''};
  uiStore.ts `WorkflowStage = ''auto''|''edit''|''qa''|''review''`, `SidePanelTab`
  includes ''ai'', setWorkflowStage maps auto->''ai''; volumeRefresh.ts comment mentions
  auto-contouring.

  - shared-types: StructureSetSource.type includes ''ai-draft'' plus generatorService/modelProfileId/modelDisplayName/generatedAt;
  AutoContour* types.

  - Dev/docs: package.json `autocontour:service`, scripts/dev/up.mjs and bootstrap.mjs,
  doctor.mjs (check 4010), README.md, docs/local_development.md (docs/project-review-2026-10.md
  is a dated historical record and stays; name it as the exception in the PR), scripts/ci/check_medharness_contract.py
  comment.

  - workflowStage is in-memory uiStore state only (default ''edit''), not persisted.
  Drafts live in IndexedDB (structureDraftStore) and are parsed by importStructureSets
  in structurePersistence.ts.


  ## Changes Required

  - Delete: apps/autocontour-service/, API controller/client/contracts/tests, client
  core/autocontour/, shared-types AutoContour* types, AI-only tests in StructurePanel.test.tsx
  and Toolbar.test.tsx, the `autocontour:service` script, the service block, volume
  and env var in docker-compose.deploy.yml, the 4010 doctor check.

  - Modify Program.cs (drop HttpClient/DI), up.mjs, bootstrap.mjs, doctor.mjs, package.json,
  README.md, docs/local_development.md (ports, service rows, limits section), check_medharness_contract.py
  comment (loopback rule itself unchanged), volumeRefresh.ts comment.

  - shared-types: StructureSetSource.type = ''manual''|''rtstruct''|''local-draft'';
  remove generator fields.

  - uiStore: WorkflowStage = ''edit''|''qa''|''review''; SidePanelTab drops ''ai'';
  remove the auto branch. Default stage stays ''edit''; since stage is not persisted
  nothing is migrated. Toolbar steppers renumber: 01 Edit, 02 QA, 03 Review. StructurePanel:
  remove AI tab, state, polling, label/Kind/Model/Generated rows for ai-draft.

  - structurePersistence.importStructureSets: normalise source.type ''ai-draft'' ->
  ''local-draft'' and drop generator fields (SRS-009 T8). Keep this normalisation
  as the only mention of the legacy value, with a WHY comment (a release-notes line
  is allowed; the acceptance criterion permits it).

  - scripts/deploy/deploy.sh: build `api client` only (`up -d --build --no-deps`,
  no --remove-orphans: the removal is explicit). Before `up`, on every deploy, run
  idempotent `docker rm -f contourlab-autocontour-service`, `docker image rm contourlab-autocontour-service:latest`
  and `docker volume rm totalseg-models`, each tolerating absence and never touching
  dicom-repo or its data directory. Mark the block as removable once every workstation
  has been redeployed (SRS-038, SWDD-018).

  - Optionally add a release-notes entry (ReleaseNotes data) saying auto-segmentation
  was removed.


  ## Implementation Steps

  1. shared-types: trim StructureSetSource and delete AutoContour types; `pnpm -r
  typecheck` to find users.

  2. Client: uiStore, Toolbar, StructurePanel, autocontourClient removal, importStructureSets
  normalisation; update tests.

  3. API: delete files, edit Program.cs; `dotnet build apps/api/api.csproj -c Release`
  and run api tests.

  4. Delete apps/autocontour-service; edit compose, deploy.sh, dev scripts, package.json,
  docs, README, contract checker comment.

  5. grep -ri "autocontour|auto-contour|totalseg|4010|ai-draft" to confirm only the
  deploy cleanup and the legacy normalisation remain.

  6. Run client tests, lint, typecheck, `medharness verify dhf --strict`, `verify
  tests --strict`, `python scripts/ci/check_medharness_contract.py`.


  ## Edge Cases & Constraints

  - Legacy IndexedDB drafts and exported payloads with source.type ''ai-draft'' must
  load (SRS-009 T8); do not bump the payload version.

  - The workstation still runs the old container and volume: compose `up` without
  them leaves them running, so deploy.sh must remove them explicitly; removal must
  not fail when absent and must not touch the dicom-repo container or its data directory
  (RCM-016 backup/pin logic untouched).

  - The loopback contract check must keep passing; its rules iterate over compose
  services so they need no change.

  - SRS-037 now lists edit and review as editable stages; the QA gate behaviour is
  unchanged. Users who last had the ''auto'' step simply start at Edit.

  - CR-024 text (done) still describes the stepper with Auto-segment; leave it, history.

  - Tests existing only for the feature (Python service tests, AutoContourEndpointTests,
  AI-tab tests) are deleted, not skipped.


  ## Tests

  - SRS-009 T8: structurePersistence unit test — import payload with ''ai-draft''
  source yields ''local-draft'' with contours intact, generator fields absent; also
  a draft-store round trip.

  - SRS-037 T5: Toolbar test — controls shown in Edit and Review stages; tool stepper
  shows exactly Edit, QA, Review (adjust existing Toolbar.test.tsx cases that use
  ''auto'' or ''01 Auto-segment'').

  - SRS-038 T1: extend scripts/ci/check_medharness_contract.py to fail when the `up`
  command in deploy.sh names a service the compose file does not define. SRS-038 T2:
  manual on the workstation: container, image and volume gone, dicom-repo and its
  data intact, a second deploy exits 0.

  - SRS-035 T1 / SYS-018: contract check still passes. SRS-006: existing computeVolume
  tests unchanged (wording only).

  '
impact_analysis:
  assumptions:
  - 'The CR''s description is fully authoritative: remove the feature and everything
    that names it; a release-notes line is optional.'
  - Legacy 'ai-draft' sources are normalised to 'local-draft' on import; the deploy
    cleanup lines in deploy.sh and the legacy normalisation are the only permitted
    remaining mentions.
  - workflowStage is not persisted (in-memory uiStore, default 'edit'), so removing
    'auto' needs no migration; the stepper becomes 01 Edit, 02 QA, 03 Review.
  - The feature is a user-visible capability the DHF never covered; removing it keeps
    it out of the DHF (no CRS/SYS/SRS existed, so none is created or deleted). The
    requirement and risk text that named it is corrected.
  - No SOUP item exists for TotalSegmentator/FastAPI (SOUP-001 is vtk.js; the other
    SOUP entries are untitled) so no SOUP item is removed; the Python dependencies
    were never registered.
  - docs/project-review-2026-10.md is a dated historical review and is left unchanged;
    it is the one documentation exception to the acceptance criterion and is named
    in the PR so the reviewer can overrule it.
