implementation_notes: '## Overview

  Remove the auto-contouring feature end to end: the Python autocontour-service, the
  API proxy endpoints, the client AI tab and ''Auto-segment'' workflow stage, the
  shared types and every deploy/dev/CI reference. The workflow becomes Edit, QA, Review
  (default Edit). No replacement behaviour is added.


  ## Current State

  - apps/autocontour-service/ (FastAPI + TotalSegmentator, port 4010): main.py, inference.py,
  profiles.py, Dockerfile, requirements.txt, test_*.py (5 files). Untracked models/
  and training.log are the user''s and are NOT touched.

  - apps/api: Controllers/AutoContourController.cs, Models/AutoContourContracts.cs,
  Services/AutoContourServiceClient.cs; Program.cs registers the "autocontour" HttpClient
  (config AutoContour:BaseUrl / CONTOURLAB_AUTOCONTOUR_SERVICE_BASE_URL) and the scoped
  client. apps/api.tests/AutoContourEndpointTests.cs.

  - apps/client: src/core/autocontour/autocontourClient.ts; StructurePanel.tsx holds
  the ''ai'' PanelTab, all autoContour* state, handleRunAutoContour, polling constants,
  formatAutoContourState, the `ai-draft` label branch (~line 152) and the AI panel
  JSX (~1822-1948); Toolbar.tsx WORKFLOW_STAGES has { id: ''auto'', num: ''01'', label:
  ''Auto-segment'' }; core/store/uiStore.ts has WorkflowStage ''auto'', SidePanelTab
  ''ai'' and the stage->tab map (~line 168).

  - packages/shared-types/src/index.ts: AutoContourModelProfile, AutoContourSeriesSlice,
  AutoContourSeriesPayload, AutoContourJobCreateRequest/Response, AutoContourJobState,
  AutoContourJobStatus, AutoContourResultPayload (lines ~109-175) and source.type
  ''ai-draft'' (line 81).

  - Deploy/dev: docker-compose.deploy.yml (autocontour-service service, api depends_on,
  CONTOURLAB_AUTOCONTOUR_SERVICE_BASE_URL, header comment), scripts/deploy/deploy.sh
  line ~125, scripts/dev/up.mjs (service block, port 4010), scripts/dev/bootstrap.mjs
  line ~28 (restore of a csproj that no longer exists), package.json script autocontour:service,
  scripts/ci/check_medharness_contract.py comment (line ~206), local doctor script
  if it checks 4010 (grep scripts/).

  - Docs: README.md (service in ports table, pnpm autocontour:service, ''Auto-Contouring''
  section, layout tree), docs/local_development.md (ports, service, ''Auto-Contouring
  Workflow'' and limits sections), docs/project-review-2026-10.md (historical; leave).


  ## Changes Required

  - DELETE apps/autocontour-service/ tracked files (git rm); leave untracked models/
  and training.log in place. If .gitignore lists them, leave it.

  - DELETE AutoContourController.cs, AutoContourContracts.cs, AutoContourServiceClient.cs,
  AutoContourEndpointTests.cs; MODIFY Program.cs to drop the HttpClient and the scoped
  client (keep other registrations).

  - DELETE src/core/autocontour/. MODIFY StructurePanel.tsx: remove the ''ai'' tab
  button, PanelTab member, all autoContour state/refs/effects/handlers/constants/imports,
  the AI panel JSX, and the `ai-draft` branch in the structure-set label helper; remove
  the stage->tab entry for ''auto''. MODIFY Toolbar.tsx: drop the ''auto'' stage and
  renumber to 01 Edit, 02 QA, 03 Review. MODIFY uiStore.ts: WorkflowStage = ''edit''
  | ''qa'' | ''review''; SidePanelTab without ''ai''; stage map without ''auto''.
  Check any persisted/localStorage value of ''auto''/''ai'' falls back to ''edit''/''structures''.
  Update volumeRefresh.ts doc comment (drop "auto-contouring").

  - MODIFY shared-types: delete the AutoContour* types; remove ''ai-draft'' from the
  source type union (and modelDisplayName/related optional fields if only used by
  ai-draft; grep before deleting). Shared types first, then fix compile errors outward.

  - MODIFY docker-compose.deploy.yml, deploy.sh, up.mjs, bootstrap.mjs, package.json,
  check_medharness_contract.py comment, README.md, docs/local_development.md as listed
  above. The compose loopback contract check must still pass for the remaining services.

  - DHF (already edited in this design): SYS-018, CRS-015, RISK-010 (drop the auto-contour
  service from the lists), SRS-006 (drop auto-contouring from the volume-recompute
  routes), SRS-037 (stages edit, review).

  - TESTS: delete StructurePanel auto-contour tests and mocks (mocks.listAutoContourModels
  etc., ''runs auto-contouring and imports an AI draft...'', the ai-tab test at ~line
  1317) and update Toolbar.test.tsx (stepper shows Edit, QA, Review; the ''01 Auto-segment''
  click test at ~598 must use another stage) and uiStore.test.ts (stage->tab table,
  the tab list).


  ## Implementation Steps

  1. Shared types: remove AutoContour* and ''ai-draft''; `pnpm -r typecheck` and use
  the errors as the work list.

  2. Client: uiStore, Toolbar, StructurePanel, delete autocontourClient, fix tests;
  `pnpm --filter @contourlab/client test lint typecheck`.

  3. API: delete files, edit Program.cs, `dotnet build apps/api/api.csproj -c Release`
  and `dotnet test apps/api.tests`.

  4. Delete the tracked service files.

  5. Deploy/dev/CI: compose, deploy.sh, up.mjs, bootstrap.mjs, package.json, contract
  check; run `python scripts/ci/check_medharness_contract.py` and `pnpm local:doctor`
  (if it lists the service, remove it).

  6. Docs: README, local_development.md.

  7. Final `git grep -i -E ''autocontour|auto-contour|auto-segment|ai-draft|4010''`
  should only match docs/project-review-2026-10.md, CR-024 and this CR.

  8. `medharness verify dhf`, `verify changes --cr CR-025`, `verify completion`.


  ## Edge Cases & Constraints

  - Do not delete or modify untracked apps/autocontour-service/models and training.log
  (the user handles them). Because tracked files are removed, the directory stays
  on disk; do not `git clean`.

  - Structure sets already saved with source.type ''ai-draft'' (in Orthanc RTSTRUCT
  or local drafts) must still load: the client must not crash on an unknown source
  type; verify how source is read and fall back to the generic label.

  - The ''auto'' stage must not remain reachable from stored UI state or URL; default
  stage is already ''edit''.

  - No requirement describes auto-contouring (SRS-006 only mentions it as a route),
  so no requirement is deleted; do not add tests with @links for removed behaviour.

  - RISK-010/RCM-014 are not weakened: removing a service shrinks the unauthenticated
  surface. SRS-035 and the contract check are generic over compose services and stay
  valid.

  - Removing the service drops Python deps (totalsegmentator, torch transitively)
  from deployment; no SOUP items exist for them, so no SOUP change. DHF/sbom.cdx.json
  is untracked build output; ignore.


  ## Tests

  - Unit/component: Toolbar.test.tsx (three stages), StructurePanel.test.tsx (no AI
  tab; remaining tabs still work), uiStore.test.ts (stage->tab map for edit/qa/review).
  SRS-037 tests (@links:SRS-037) keep passing, stage list updated. SRS-006 volume
  tests unchanged.

  - API: remaining tests (Health, DhfArtifacts, ClientDebugLog) pass after the build.

  - Contract: scripts/ci/check_medharness_contract.py passes (SRS-035 T1, SYS-018
  T1).

  - Manual: open the app, confirm the stepper shows Edit/QA/Review, the right panel
  has Structures/QA/Review/Audit, loading a series with an existing structure set
  labelled as AI draft still opens.

  '
