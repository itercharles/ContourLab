id: CR-025
title: remove the auto-contouring feature
description: '### Requested change


  Remove auto-contouring: its capability is weak and not worth maintaining. Remove
  the autocontour-service (apps/autocontour-service), the API AutoContourController/Contracts/ServiceClient
  and its HttpClient registration, the client autocontourClient and the AI tab in
  StructurePanel, the ''Auto-segment'' workflow stage (workflow keeps Edit, QA, Review;
  default stays Edit), the shared-types AutoContour* types and the ''ai-draft'' structure-set
  source, compose/deploy/dev-script/CI-contract references to the service and port
  4010, and update README/docs and DHF text that mentions the service (SYS-018, CRS-015,
  SRS-006, RISK-010, RCM-014 where affected). Model files and training.log under apps/autocontour-service
  are untracked and are left to the user.'
