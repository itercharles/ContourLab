implementation_notes: '## Overview

  Fix defect #164: right-click > Maximize View leaves a grey, empty view. Restore
  also leaves views grey. Make the code match SRS-019 and SWDD-010: keep all panels
  mounted and change only layout.


  ## Current State

  apps/client/src/components/viewer/ImageViewer.tsx: ImageViewer renders `maximizedViewport
  ? <div className="flex h-full gap-[1px]">{only chosen ViewportPanel}</div> : <div
  className="grid h-full grid-cols-2 grid-rows-2">{3 panels + ThreeDViewport}</div>`.
  ViewportPanel root div has no flex-1/w-full, so in the flex row it has zero width.
  Switching branches unmounts the panels; Cornerstone viewports (ViewportManager.enableElement)
  stay bound to the old detached elements, so the new elements show nothing after
  maximize or restore. readyViewportIds is not reset, so onReady does not re-enable.
  uiStore holds maximizedViewport, toggleMaximizeViewport, resetMaximizeViewport (unchanged).


  ## Changes Required

  - modify apps/client/src/components/viewer/ImageViewer.tsx: render a single grid
  container with the 3 ViewportPanels and ThreeDViewport always mounted. Pass a className
  or `hidden`/`col-span-2 row-span-2` via a prop on ViewportPanel (and a wrapper or
  prop for ThreeDViewport) depending on maximizedViewport. Remove the two-branch conditional.
  Add an effect on maximizedViewport that calls ViewportManager.resize() (and renders
  the viewports) after layout.

  - modify apps/client/e2e/crs/real-dicom.spec.ts: remove test.fail() from the two
  #164 tests, add `@links:SRS-019 @testing:T3` and `@links:SYS-002 @testing:T5` to
  their names.

  - no change to uiStore, ViewportContextMenu, ContourOverlay.


  ## Implementation Steps

  1. Reproduce with `pnpm repo:up && pnpm repo:seed` and the two #164 e2e tests (expected
  failures today).

  2. Restructure ImageViewer as above; confirm ThreeDViewport does not lose its WebGL
  context when hidden (hidden uses display:none; check resize guards against zero
  size).

  3. Add resize call after maximize/restore, guarded for hidden panels (skip zero-size
  elements).

  4. Remove test.fail() and add tags; run e2e.

  5. Add a vitest component test that all four panels stay mounted and non-selected
  panels have the hidden class when maximized.

  6. Run client test, lint, typecheck, `medharness --dhf DHF verify dhf`.


  ## Edge Cases & Constraints

  Escape handler and patient-change reset must still work. A hidden panel has zero
  size: Cornerstone resize must not throw. Active viewport ring and ContourOverlay
  must keep following their panel. No `any`, Tailwind only, no inline styles.


  ## Tests

  - SRS-019 T3 (e2e, real DICOM): maximized axial panel width > 300 px with image;
  after Escape all three planar views show image.

  - SYS-002 T5: same e2e flow.

  - SRS-019 T1/T2: existing uiStore tests remain.

  - Unit: ImageViewer keeps panels mounted across maximize and restore.'
