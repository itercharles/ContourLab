  ## Edge Cases & Constraints

  - A number never changes once used: only append points. Do not rewrite CRS/SYS text.

  - Declaring Test on SRS-035/SYS-018 before the JUnit exists makes `verify tests`
  fail (''declares Test but no passing case is linked''): change the method in the
  same commit as the workflow.

  - The contract job must upload its JUnit even when the check fails; downstream download
  steps for it must not be continue-on-error.

  - Keep @testing numbering aligned: a test linking two requirements must mean the
  same Tn on both.

  - IEC 62304 8.1.2: every SOUP shipped (Orthanc, runtime images, API package) needs
  safety class, anomaly list and verification; build-stage images are tools.

  - Do not use the literal skip-ci token in commit messages.


  ## Tests

  No new product tests. Evidence: the narrowed/retagged existing tests (T-points per
  table), two or three new contract-check JUnit cases (SRS-035 T1, SYS-018 T1, optional
  T2), the split Toolbar save tests (SYS-006 T1, T2; CRS-005 T1). Acceptance: strict
  verify tests exits 0 with only the CRS-015 warning (or none if option (a) is taken);
  verify dhf, verify impact and verify soup show no new findings.


