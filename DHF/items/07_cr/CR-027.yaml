implementation_notes: '## Overview

  Make the DHF consistent so `medharness verify tests --strict` passes on MedHarness
  0.71 and close the cheap evidence-bundle findings. No product code changes; the
  edits are DHF items, test annotations (describe/it names), one CI script and workflow,
  and one plan document. Root cause of the 32 undeclared-point errors: a test inherits
  the `@links:` of its enclosing describe, so a test written for one requirement''s
  point `Tn` also claims `Tn` on every other requirement in that describe, where the
  number means something else or does not exist. Several passing claims are also semantically
  wrong today (see "Hidden mismatches"); the narrowing below removes them.


  ## Current State

  - `verify tests --strict` (J = verify-srs, verify-srs-api, verify-sys, validate-crs
  JUnit) fails with 32 errors; JUnit carries `medharness.links` (union of describe
  and test @links) and `medharness.testing` (the test''s @testing tags).

  - Method rule: a requirement whose methods are only Inspection/Analysis/Demonstration
  only warns ''needs a human sign-off record''; MedHarness has no sign-off record
  field, so Inspection can never be silenced. CRS-015, SYS-018, SRS-035 are Inspection-only.

  - `scripts/ci/check_medharness_contract.py` (job `medharness-contract` in ci-pipeline.yml)
  already checks every compose port starts with 127.0.0.1 and nginx.conf has no `location
  /orthanc`, but writes no evidence.

  - SOUP register: SOUP-001..037 (npm/PyPI only). Fields (see SOUP-011): name, version,
  ecosystem, manufacturer, purpose, license, source, homepage, risk_rating, safety_class,
  verification_method, cve_count. `build soup` cannot read csproj ("Unsupported manifest
  format"), so NuGet items are not reconciled by any gate.

  - SOUP-025 was `@types/uuid`; it was deleted deliberately with the package in commit
  d995989 (PR #160, ''drop the @types/uuid stub'', register entry removed). IDs are
  not reused, so the gap is correct; nothing to do beyond saying so in the PR.

  - `DHF/documents/plans/configuration_management_plan.md` line 27 lists `DHF/test-results/results.yaml`;
  no such file or directory exists (only CLAUDE.md line 17 mentions a DHF test-results
  folder). Real results are the four CI JUnit artifacts, kept in the evidence bundle
  under `product-test-results/{srs,srs-api,sys,crs}/` with `evidence-summary.json`
  and `evidence-manifest.json`.


  ## Changes Required

  ### Part 1: test points (rule: where the number means the same point on every linked
  requirement keep it; where it does not, move @links from the describe onto the `it`
  so the test links only the requirement whose Tn it means; declare a new point only
  when the requirement''s own text promises that behaviour)

  Decision table (claims: 32). ''narrow'' = test change only, no DHF change.

  | Req / claim | Test (file) | Decision |

  |---|---|---|

  | CRS-001 T4 | ''workspace shows no active patient...'' (e2e/crs/imaging.spec.ts)
  | retag. The spec''s numbers are shifted by one against CRS-001 T1-T3: ''identify
  the study by description and date'' T2->T1 (T1 includes study description), ''search
  by MRN'' T3->T2, ''no active patient'' T4->T3 (declared T3 is exactly this) |

  | CRS-005 T2,T3,T4; SYS-006 T3,T4 | rtstructExport.test.ts ''predecessor ref'',
  ''DICOM blob'', ''identifiers'' | narrow: these are SRS-010 T2-T4 verbatim; give
  the describe/it `@links:SRS-010` only. Also fixes hidden claims of CRS-005 T1 /
  SYS-006 T1,T2 by the unrelated manual-structure-set and predecessor tests |

  | CRS-005 T1, SYS-006 T1/T2 (lose their wrong claimant) | Toolbar.test.tsx ''saves
  active structure changes from the global title bar'' (currently @links:SRS-018,
  which is the context-menu SRS: wrong) | split into two tests: A `@links:SYS-006,CRS-005
  @testing:T1` (click Save, export + upload happen, dirty cleared) and B `@links:SYS-006
  @testing:T2` (source gets new SOP instance UID) |

  | CRS-006 T2,T3,T4 | rtstructImport.test.ts volume_cc tests | narrow: they are SYS-007
  T2-T4 verbatim; `@links:SYS-007` per test (drop CRS-006 and SRS-010: SRS-010''s
  T2-T4 are export points). First test (ROI mapping) `@links:SYS-007,CRS-006 @testing:T1`
  |

  | CRS-007 T2,T3; SRS-015 T2,T3; SYS-008 T2,T3 | structureSetCompare.test.ts (one
  test tagged T1 T2 T3) | retag to `@testing:T1` only: one test checks counts, volume
  delta and target slice, which together are the declared T1 on all three requirements
  |

  | SRS-028 T6,T7; SYS-014 T6,T7 | ThreeDViewport.test.tsx refresh, abort | narrow:
  SRS-029 T6/T7 verbatim; `@links:SRS-029` per test. SYS-015 covers the system level
  |

  | SYS-014 T4 | ''live 3D viewport status'' (T4), ''reset the 3D camera'' (T2 T4)
  | live status: `@links:SRS-028 @testing:T4` (SRS-028 T4 is exactly it; SYS-014 T1
  is covered by e2e). reset: `@links:SYS-014 @testing:T2` (drop the T4). rotation:
  `@links:SYS-014 @testing:T3` |

  | SYS-009 T2,T3,T4,T5 | contourReview.test.ts | DECLARE T2-T5 on SYS-009, numbers
  already match SRS-011 (same convention as SYS-007 mirroring SRS-010 points); text
  below |

  | SYS-010 T2,T3 | contourQuality.test.ts open/gap/area; centroid/bounds | DECLARE
  T2, T3 on SYS-010 (its content lists these issue types); text below |

  | SYS-010 T4 | ''skips disabled contour QA rules'' | narrow to `@links:SRS-013`
  (browser-local rule config is SRS-013 content, not SYS-010) |

  | SYS-012 T2,T3 | e2e/sys/workspace.spec.ts Escape, search input | narrow: these
  are SYS-011 T2/T3; split the describe so those tests link only SYS-011 (also stops
  ''patient browser opens'' claiming SYS-012 T1) |

  | SYS-016 T3,T4,T5 | ReleaseNotes.test.tsx back link, title, wrap | narrow: SRS-031
  T3-T5 verbatim; the back link is not in SYS-016 text. T1/T2 tests keep `@links:SRS-031,SYS-016`
  |

  Result: 6 points declared (SYS-009 T2-T5, SYS-010 T2-T3), 26 claims fixed by annotation
  only. Declared text (append to `testing`, never renumber):

  - SYS-009 T2: Given a current slice position, the next control targets the next
  contour-bearing slice and wraps from the last to the first.

  - SYS-009 T3: Given a current slice position, the previous control targets the previous
  contour-bearing slice and wraps from the first to the last.

  - SYS-009 T4: Given a next-slice request, the target slice and the scroll delta
  to the closest image frame of the axial viewport are resolved.

  - SYS-009 T5: Given a direct scroll-to-slice request, the frame delta to the closest
  matching image frame is resolved.

  - SYS-010 T2: Given contours with open polygons, slice gaps larger than the image
  spacing or abrupt adjacent-slice area changes, the analysis reports each issue type.

  - SYS-010 T3: Given abrupt adjacent-slice centroid shifts or contours outside the
  image bounds, the analysis reports centroid-jump and out-of-bounds issues.

  Field: `testing` (one `Tn: text` per line), exactly as SYS-013.

  Hidden mismatches that the narrowing must not turn into new coverage gaps (re-run
  strict after each file):

  - SRS-029 T1-T4 and SRS-028 T1-T3 are claimed today only through describe inheritance.
  Retag the real tests: threeDGeometry.test.ts describe -> `@links:SRS-028` (T1-T3
  round-trip/mask/holes); its ''downsamples a volume...'' test -> `@links:SRS-029
  @testing:T1`; threeDScene.test.ts: ''reuses vtk pipelines'' -> `@links:SRS-029 @testing:T2`,
  ''disposes the previous vtk pipelines'' (now untagged-link @testing:T1) -> `@links:SRS-029
  @testing:T3`, ''keeps the current camera on subsequent scene refreshes'' -> `@links:SRS-029
  @testing:T4`.

  - SYS-009 T1 (panel shows slice count) is claimed by the getReviewSlices unit test;
  the component test ''shows contour review count in the compact active-structure
  summary'' (links SRS-011) is the right claimant: add `@links:SYS-009 @testing:T1`
  only if SRS-011''s T1 numbering is not claimed by it (otherwise leave and report).

  - rtstructImport/rtstructExport describes also linked SRS-010 on tests that are
  not SRS-010 points (handled above).


  ### Part 2: Inspection-only requirements

  - SRS-035 and SYS-018 (modify DHF items; modify script and workflow): `check_medharness_contract.py`
  gets `--junit-out PATH`. Extract the loopback/nginx rules (lines ~207-240) into
  `check_loopback_only(compose_texts, nginx_text) -> list[str]`; main uses it. With
  `--junit-out` write a JUnit file with two testcases, each with properties `medharness.links=SRS-035,SYS-018`
  and `medharness.testing=T1`: (1) ''compose files publish only on 127.0.0.1 and nginx
  does not proxy /orthanc/'' (the repository files, passes), (2) ''the check rejects
  a port published on all interfaces and an /orthanc/ proxy'' (runs the function on
  mutated in-memory copies and must get errors). Both T1 halves are then evidence
  (T1 says it fails when broken and passes on the repository). Write the file even
  on failure (failed testcase). ci-pipeline.yml: step in `medharness-contract` runs
  `python scripts/ci/check_medharness_contract.py --junit-out test-results/contract/contract-junit.xml`,
  uploads artifact `verify-contract-junit` (if: always()); the compliance gate and
  the CR closure gate download it into `test-results/contract/` and pass `--junit
  test-results/contract` in all three verify tests/completion invocations (lines ~560,
  ~577, ~653); release-baseline.yml adds the artifact pair `verify-contract-junit:contract`
  to its download loop; keep the contract check''s required-needles list valid. Then
  `item update` SRS-035 and SYS-018 `verification_method` to ["Test"] (keep text);
  SWDD-018 gets one line saying the check emits the JUnit evidence. Not covered by
  T1: the deploy.sh recreate rule in SRS-035''s text; either add T2 (grep-level case
  for the recreate step in deploy.sh) in the same JUnit or narrow that sentence; default:
  add T2 on SRS-035 with a third testcase.

  - CRS-015: its T1 is about the deployed system, which a configuration check does
  not prove, so tagging the same cases would overstate. Options for the human (see
  report): (a) recommended: `dev-integration` job adds a step that, with the stack
  up, asserts via `ss -ltnH` that ports 3000/4000/8042 listen only on 127.0.0.1, emitting
  JUnit `@links:CRS-015 @testing:T1`, then CRS-015 method -> Test; (b) keep Inspection
  and accept the standing warning (MedHarness offers no sign-off record). Not changed
  until decided.


  ### Part 3: SOUP

  Create (item create --type SOUP, copy field set from SOUP-011; new IDs SOUP-038
  onward; SOUP-025 is not reused):

  | Name | Version | Ecosystem | Safety class / risk | Source |

  |---|---|---|---|---|

  | orthancteam/orthanc (Orthanc DICOM server) | 26.1.0 @sha256:a055ccd3...fc57 |
  none (OSV has no container ecosystem) | C, High: holds the only copy of pushed structure
  sets and images | docker-compose.yml, docker-compose.deploy.yml |

  | Microsoft.AspNetCore.OpenApi | 10.0.5 | NuGet | C (runs in the API), Low | apps/api/api.csproj
  |

  | mcr.microsoft.com/dotnet/aspnet | 10.0 (floating tag) | none | C (runtime of the
  API image), Medium | apps/api/Dockerfile |

  | nginx | 1.27-alpine (floating tag) | none | C (serves the client), Medium | apps/client/Dockerfile
  |

  | mcr.microsoft.com/dotnet/sdk | 10.0 | none | not part of delivered software (build
  stage) | apps/api/Dockerfile |

  | node | 22-bookworm-slim | none | not part of delivered software (build stage)
  | apps/client/Dockerfile |

  | test-only NuGet, apps/api.tests csproj (not in the CR text; include for parity
  with the client devDependencies, drop if you disagree): coverlet.collector 6.0.4,
  JUnitTestLogger 1.1.0, Microsoft.AspNetCore.Mvc.Testing 10.0.7, Microsoft.NET.Test.Sdk
  17.14.1, xunit 2.9.3, xunit.runner.visualstudio 3.1.4 | | NuGet | not part of delivered
  software | apps/api.tests/ContourLab.Api.Tests.csproj |

  Purposes, manufacturers (Orthanc Team / Osimis; Microsoft; F5 Inc./NGINX; OpenJS
  Foundation), licenses (Orthanc GPL-3.0-or-later and plugin licences: check the image;
  Microsoft packages MIT; nginx BSD-2-Clause; node MIT) are to be filled from the
  sources; verification_method for Orthanc: the digest pin is enforced by the contract
  check, `pnpm repo:seed` + real-dicom e2e + RCM-010/RCM-016. If `verify soup --strict`
  warns that NuGet or Docker items have no manifest, record that in the PR and do
  not add a csproj to `--manifest` (unsupported); consider `--from-command` only as
  a follow-up. The floating image tags (10.0, 1.27-alpine, 22-bookworm-slim) are a
  follow-up (pin by digest like Orthanc), not this CR.


  ### Part 4: configuration management plan

  Edit DHF/documents/plans/configuration_management_plan.md row 27 (document, not
  an item; by hand is correct): replace `| Test results | \`DHF/test-results/results.yaml\`
  | ContourLab DHF |` with `| Test results | JUnit XML of each CI run (artifacts verify-srs-junit,
  verify-srs-api-junit, verify-sys-junit, validate-crs-junit, verify-contract-junit),
  kept in the release evidence bundle under \`product-test-results/\` with \`evidence-summary.json\`
  and \`evidence-manifest.json\` | CI artifacts, ContourLab |`. Optionally add rows
  for container images (Dockerfiles, docker-compose*.yml). Outside DHF, CLAUDE.md
  line 17 also says DHF holds test-results: mention to the human, not changed here.


  ## Implementation Steps

  1. Re-run the strict command with the four JUnit dirs to get the baseline; keep
  the output.

  2. Retag/narrow test annotations per the table (file by file); run `pnpm --filter
  @contourlab/client test`, regenerate JUnit, re-run strict after each group.

  3. `item update` SYS-009 and SYS-010 (`testing` with the six new points; improve
  verification_criteria to mention them).

  4. Contract script: refactor, `--junit-out`, negative self-test; unit test in tests/workflow
