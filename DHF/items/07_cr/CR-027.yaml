id: CR-027
title: close DHF coverage gaps found by the MedHarness 0.71 strict checks and the
  evidence-bundle review
description: '### Requested change


  Make the DHF consistent so that `medharness verify tests --strict` passes on MedHarness
  0.71.x (which fails when a test claims a test point `@testing:Tn` that the requirement
  does not declare), and close the cheap findings from the review of the CI evidence
  bundle. No product code changes.


  1. Test points: 32 claims are undeclared on CRS-001, CRS-005, CRS-006, CRS-007,
  SRS-015, SRS-028, SYS-006, SYS-008, SYS-009, SYS-010, SYS-012, SYS-014, SYS-016.
  Declare each from what the claiming test actually checks (read the test), or correct
  the tag if it is wrong.

  2. CRS-015, SYS-018 and SRS-035 are verified by Inspection only, with no record.
  Record the verification: make the contract check (`scripts/ci/check_medharness_contract.py`)
  produce JUnit linked to SRS-035 and change the method to Test, or record the inspection.

  3. SOUP register lacks Orthanc (orthancteam/orthanc 26.1.0), the NuGet packages
  in apps/api/api.csproj and the Docker base images. Add entries (version, safety
  class). Explain the missing SOUP-025.

  4. docs: configuration management plan refers to DHF/test-results/results.yaml,
  which does not exist; correct it.


  Out of scope: SOUP anomaly-evaluation convention, REL-001, API test links; vulnerable
  dcmjs and vite versions (separate change).'
