implementation_notes: '## Overview

  In the QA workflow stage all contour editing controls (including Undo/Redo and the
  shortcuts) are hidden or inert; QA is check-only and the user switches to another
  stage to modify. Review and Approve keep editing as today (stage gate is only ''qa'');
  whether they should also be check-only is a follow-up. Requirement: new SRS-037
  (derived from SYS-004 T6); SRS-014 is unchanged.


  ## Current State

  uiStore (apps/client/src/core/store/uiStore.ts) holds workflowStage (''auto''|''edit''|''qa''|''review''|''approve'',
  default ''edit'') and setWorkflowStage; it also holds the active tool (read the
  exact field name in the file). Toolbar.tsx renders the stepper plus Interpolate,
  Fill Gaps, Delete Slice, Undo, Redo. ToolRail.tsx defines groups, including ''contour''
  (edit, freehand, polygon, brush, eraser) and ''structure'' (interpolate, margin,
  boolean), always rendered. Shortcuts: apps/client/src/core/input/viewerShortcuts.ts
  (installed from MainWorkspace.tsx) and the Cmd/Ctrl+Z handler in UndoRedoManager
  (installUndoRedoKeyHandler). ToolOptions.tsx shows option bars; ContourOverlay.tsx
  handles contour pointer input; StructurePanel.tsx has interpolate/margin/boolean
  apply controls (handleInterpolateApply). ContourEngine guards only on lock.


  ## Changes Required

  - uiStore.ts (modify): export canEditContours(stage) => stage !== ''qa''; in setWorkflowStage,
  when entering ''qa'', set activeTool to ''none'' only if it is a contour or structure-operation
  tool (measurement tools stay active) and set activeStructureOperationPanel to null.

  - ToolRail.tsx (modify): omit the ''contour'' and ''structure'' groups when !canEditContours.

  - Toolbar.tsx (modify): omit Interpolate, Fill Gaps, Delete Slice, Undo, Redo in
  QA.

  - viewerShortcuts.ts and the Cmd/Ctrl+Z handler (modify): return early in QA.

  - ToolOptions.tsx, StructurePanel.tsx (modify): no contour option bars or interpolate/margin/boolean
  apply controls in QA.

  - ContourOverlay.tsx (modify): discard an in-progress draft when the active tool
  is cleared; ignore pointer edits in QA.

  - ContourEngine and shared-types: no change. StructurePanel structure management
  (name, colour, type, visibility, lock, delete) stays available in QA (not a contour
  tool; follow-up if QA should freeze it).


  ## Implementation Steps

  1. uiStore predicate and tool reset, with unit test.

  2. Gate ToolRail, Toolbar, ToolOptions, StructurePanel.

  3. Gate shortcuts and Cmd/Ctrl+Z; draft discard in ContourOverlay.

  4. Run client test, lint, typecheck; medharness --dhf DHF verify dhf. Run /ux-design
  before UI work.


  ## Edge Cases & Constraints

  - Entering QA with a contour tool active, a margin/interpolate/boolean panel open
  or a polygon/freehand draft in progress: deselect, close and discard. A measurement
  tool stays active.

  - Undo history is kept; returning to a non-QA stage makes Undo/Redo available again.

  - Navigation, measurement and contour review (previous/next) tools stay in QA.

  - Tailwind only, dark theme, no inline styles.


  ## Tests

  Tags: @links:SRS-037 @testing:Tn; SYS-004 T6 uses @links:SYS-004 @testing:T6.

  - apps/client/src/core/store/uiStore.test.ts: canEditContours; entering QA clears
  a contour tool and activeStructureOperationPanel but keeps a measurement tool (SRS-037
  T3, T4).

  - apps/client/src/components/viewer/Toolbar.test.tsx: ToolRail and Toolbar in ''qa''
  vs ''edit'' (SRS-037 T1, T5, T6; SYS-004 T6).

  - apps/client/src/core/input/viewerShortcuts.test.ts: shortcuts and Cmd/Ctrl+Z no-op
  in QA (SRS-037 T2).

  - apps/client/src/components/structures/StructurePanel.test.tsx: no apply controls
  in QA (SRS-037 T1).



  ## Implementation deviations

  - Toolbar.tsx has no Interpolate/Fill Gaps/Delete Slice buttons (only the stepper,
  Undo and Redo), so only Undo/Redo are gated there.

  - ToolOptions.tsx needed no change: entering QA sets activeTool to ''none'', so
  no contour option bar renders.

  - ContourOverlay.tsx already discards its draft when the active tool is not interactive;
  it additionally treats contour tools as inactive in QA.

  - The Cmd/Ctrl+Z gate lives in installUndoRedoKeyHandler (UndoRedoManager.ts); tests
  added in UndoRedoManager.test.ts.

  '
