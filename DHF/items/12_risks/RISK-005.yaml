id: RISK-005
title: Left/right or head/foot confusion
hazard: The clinician cannot tell the patient's left from right, or head from foot,
  in a 2D view.
cause: No orientation markers or patient position are shown, and feet-first or prone
  series display with their axes flipped relative to a head-first supine scan.
effect: A structure is drawn or reviewed on the wrong side or end of the patient and
  treated there.
severity_pre: S5
probability_pre: P3
severity_post: S5
probability_post: P3
risk_acceptability: Unacceptable
type: RISK
