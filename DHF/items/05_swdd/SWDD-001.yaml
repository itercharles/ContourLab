id: SWDD-001
title: Zustand + Immer stores for application state
content: "Application state is managed via three Zustand stores using the Immer\n\
  middleware for immutable updates:\n- volumeStore: loaded DICOM series, active series\
  \ UID, loading/error state\n- structureStore: structure sets, structures, contour\
  \ slices, active structure\n- uiStore: active tool, window/level preset, brush radius,\
  \ sidebar state,\n  crosshairs enabled, active viewport\n\nStores are accessed via\
  \ useXxxStore() hooks in components or\nuseXxxStore.getState() in non-React code\
  \ (managers, engines).\n\nFloat32Array contour points must NOT be mutated through\
  \ Immer drafts.\nContourSlice objects must be replaced entirely (not patched in\
  \ place).\n\nuiStore.setWorkflowStage('qa') also resets activeTool (when it is a\
  \ contour tool) to 'none' and activeStructureOperationPanel to null, so the QA stage\
  \ is view-only (SRS-036)."
implements:
- SRS-007
- SRS-008
- SRS-036
module: [MODULE-001]
