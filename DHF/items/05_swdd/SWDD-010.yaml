module: [MODULE-008]
title: Viewport maximize feature - UI state and layout rendering
content: 'uiStore extends the existing Zustand state with maximizedViewport field:
  "AXIAL" | "SAGITTAL" | "CORONAL" | null (initially null). toggleMaximizeViewport(viewportId:
  string | null) toggles between maximized and normal state; resetMaximizeViewport()
  unconditionally clears the maximized state for patient change events.


  ImageViewer keeps all four panels (axial, sagittal, coronal, 3D) mounted in one
  container at all times; it never unmounts or remounts a viewport panel on maximize
  or restore, because Cornerstone3D binds a rendering-engine viewport to a specific
  DOM element and a remounted element is left detached (grey). Maximize and restore
  change only layout classes: when maximizedViewport is null, the standard 2x2 grid
  with equal proportions; when set, the chosen panel spans the whole container (full
  width and height, e.g. col-span-2 row-span-2 in the same grid) and the siblings,
  including the 3D panel, are hidden with the Tailwind hidden class. A panel must
  never be a flex child without explicit sizing (a zero-width panel is the cause of
  defect #164). After every layout change, ViewportManager.resize() is called so the
  rendering engine resizes the canvases of the newly visible panel and the restored
  panels, and they re-render. Flex layout transitions are optional for Phase A.


  Viewport components add onContextMenu handler to the Cornerstone3D canvas. A ContextMenu
  component renders conditionally at cursor location with "Maximize View" or "Restore
  View" option. Clicking the option calls toggleMaximizeViewport().


  Keyboard handler listens for Escape key on ImageViewer; when maximizedViewport is
  set, calls resetMaximizeViewport(). Patient/study change effect calls resetMaximizeViewport()
  to auto-restore layout. All other workspace panels (repository browser, structure
  list, toolbar) remain visible and unchanged.'
type: SWDD
