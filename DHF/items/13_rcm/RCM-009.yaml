id: RCM-009
title: Push path integrity
content: 'A failed push, or an instance the repository lists in the Failed SOP Sequence,
  is shown to the user and leaves the series unsynchronized. The store is read again
  after the upload; edits made during the upload keep the series unsynchronized and
  the user is told. A successful push deletes the older local draft. Tests: Toolbar,
  dicomWebClient and structureDraftStore tests (SRS-010 T9-T11, SRS-009 T5).'
mitigates:
- RISK-007
implements:
- SYS-006
control_type: Protective Measure
implementation_status: Implemented
type: RCM
