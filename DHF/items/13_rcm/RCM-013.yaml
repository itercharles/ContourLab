id: RCM-013
title: Identity checks on export
content: 'The RT Structure Set export fails, with the reason shown and nothing written,
  instead of inventing a frame-of-reference UID or using the study UID as the Patient
  ID; the patient''s birth date and sex are carried from the images; each contour
  references the image it lies on or none; the structure types avoidance and support
  round-trip. Tests: rtstructExport, buildMetadata and dicomWebClient tests (SRS-010
  T12 to T15). Checked against a real Orthanc: the stored RT Structure Set carries
  the images'' patient ID and frame of reference and is filed under the existing patient.
  Before anything is sent, a confirmation shows the patient name, Patient ID, birth
  date and sex, study, image series, structure set and repository address, and a push
  goes ahead only when it is confirmed (SRS-010 T16; checked in the running application
  against a scratch Orthanc: Cancel sent nothing, confirming filed the structure set).'
mitigates:
- RISK-004
implements:
- SYS-006
control_type: Protective Measure
implementation_status: Implemented
type: RCM
