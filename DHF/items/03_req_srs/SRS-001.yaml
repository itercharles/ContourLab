id: SRS-001
title: Software shall extract required image metadata from DICOMweb metadata responses
content: 'The client software shall extract patient name (0010,0010), patient ID

  (0010,0020), study instance UID (0020,000D), series instance UID (0020,000E),

  SOP instance UID (0008,0018), image position patient (0020,0032), pixel

  spacing (0028,0030), and instance number (0020,0013) from DICOMweb QIDO-RS

  and WADO-RS metadata responses. Series metadata rows missing mandatory study

  or series identifiers shall be skipped. The repository worklist shall retain

  planning CT series and exclude non-planning modalities and CBCT-like

  acquisition series from primary image-set selection. Patient selection shall

  be exposed through a dedicated selector so the primary repository panel can

  remain scoped to the current patient workspace. Patient and image-set rows

  shall indicate whether the item is active in the current workspace. Before a series
  is loaded as a volume, its slices shall be checked: a series is refused, with the
  reason shown to the user, when a slice lacks ImagePositionPatient, ImageOrientationPatient
  or PixelSpacing, when the slices disagree on orientation, size, pixel spacing or
  frame of reference, when two slices share a position, or when the series is oblique
  or gantry-tilted instead of axial; a series whose slices are unevenly spaced is
  loaded with a warning that gives the spacing range.'
derives_from: [SYS-001]
verification_method: [Test]
testing: 'T1: Given a QIDO-RS series response, patient name, patient ID, study UID,
  series UID, modality, and instance count are parsed into a series summary.

  T2: Given RTSTRUCT metadata with a ReferencedFrameOfReferenceSequence, the referenced
  series instance UIDs are extracted correctly.

  T3: Given a series of slices, validateSeriesGeometry accepts an evenly spaced axial
  series (including feet-first and prone orientations), refuses missing geometry tags,
  mixed orientation, an oblique or non-axial series, mixed frames of reference, mixed
  size or pixel spacing and duplicate positions, and warns with the range when spacing
  is uneven; buildVolume refuses a refused series before creating the volume and warns
  the user about an uneven one.

  T4: Given the metadata of a DICOMweb instance, the geometry tags are read as given,
  and the tags the instance did not carry are recorded instead of being hidden behind
  defaults.

  '
verification_criteria: 'A QIDO-RS series response yields a series summary with patient
  name, patient ID, study UID, series UID, modality and instance count; RTSTRUCT metadata
  with a ReferencedFrameOfReferenceSequence yields the referenced series instance
  UIDs. T3 and T4: a series with missing, mixed, duplicate or oblique geometry is
  refused with a reason, an unevenly spaced one is loaded with a warning, and the
  geometry tags an instance lacks are recorded.'
