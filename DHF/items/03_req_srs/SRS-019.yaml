id: SRS-019
derives_from:
- SYS-002
title: Software shall toggle viewport fullscreen layout state and restore normal layout
  on user action or patient change
content: Clicking "Maximize View" in the context menu shall set the maximized viewport
  state, causing that viewport to occupy the full image area while other viewports
  are hidden. Clicking "Restore View" or pressing Escape shall clear the maximized
  state and restore the three-pane layout. Changing the active patient shall automatically
  restore normal layout. Layout state shall not persist across workspace reloads.
verification_method:
- Test
- Demonstration
testing: 'T1: Given no maximized viewport, toggling a viewport maximizes it; toggling
  a different viewport switches to it; toggling the same viewport again clears it.

  T2: Given a maximized viewport, resetMaximizeViewport clears the maximized state.

  '
type: SRS
verification_criteria: 'T1 and T2: the maximized-viewport state is set, switched and
  cleared as described, and the reset action clears it. Demonstration: Maximize View
  makes that viewport fill the image area; Restore View or Escape restores the three-pane
  layout; changing the active patient restores it; a workspace reload starts in the
  normal layout.'
