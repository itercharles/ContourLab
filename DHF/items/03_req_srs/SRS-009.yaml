id: SRS-009
title: Software shall auto-save structure drafts in browser-local storage by series UID
content: 'When contour or structure edits mark a series dirty, the client software
  shall

  serialize the active series structure data and store it in browser-local

  IndexedDB keyed by SeriesInstanceUID. When the same series is loaded again and

  no in-memory structure data exists, the software shall attempt to restore the

  local draft. When an active series has unpublished repository changes, the

  client software shall display that state in the workspace context and require

  user confirmation before selecting another patient, activating another image

  series, or loading another RT Structure Set that would replace the current

  structure workspace. After a successful push to the repository the local draft of
  that series shall be deleted, so an older draft cannot be restored over the pushed
  version. Before a local draft is restored, the software shall check the repository
  for a structure set of the same image series that is newer than the draft; if there
  is one, it shall tell the user and ask whether to restore the older draft anyway,
  and shall not restore it unless the user agrees. If the repository cannot be checked,
  the draft shall be restored as before. A saved draft or structure set whose source
  type is the retired value ''ai-draft'' shall load as a ''local-draft'', keeping
  its structures and contours, with the retired generator fields (generatorService,
  modelProfileId, modelDisplayName, generatedAt) dropped.'
derives_from: [SYS-005]
verification_method: [Test]
testing: 'T1: Given exported structure sets, a round-trip through JSON serialisation
  preserves all structure data including Float32Array contour points.

  T2: Given an import payload with an unsupported version number, the import throws
  with a descriptive error.

  T3: Given a multi-series store, exportStructureSetsForSeries exports only the structure
  sets for the requested series.

  T4: Given a replace operation targeting a specific series, only that series'' structure
  sets are swapped while others are preserved.

  T5: Given a saved local draft, deleting the draft of the series removes it, and
  loading it afterwards finds nothing.

  T6: Given a draft save time and the structure sets in the repository, the check
  reports the repository as newer only when a structure set of the same image series
  is later than the draft (newest first whatever the order, dates with fractional
  seconds or only a series date, other series ignored), is current otherwise, and
  does not block when the repository, the study or the draft time is unknown.

  T7: Given a draft to restore, the panel restores it without asking when the repository
  has nothing newer or could not be checked, asks first when the repository has a
  newer structure set and then restores only if the user agrees, and otherwise says
  the draft was not restored.

  T8: Given a saved draft or exported payload whose structure set source has type
  ''ai-draft'' and generator fields, importing it yields a ''local-draft'' source
  with the same structures and contours and without the generator fields.

  '
verification_criteria: 'Structure drafts survive a JSON round trip including their
  Float32Array points, an unsupported version number is rejected with a descriptive
  error, export returns only the requested series, and replace swaps only that series.
  T5: the draft of a series can be deleted and is then not restored. T6 and T7: a
  draft older than the repository''s structure set is not restored unless the user
  agrees, and an unreachable repository does not stop a draft being restored. T8:
  a draft saved with the retired ''ai-draft'' source still loads, as a local draft,
  with all contours.'
