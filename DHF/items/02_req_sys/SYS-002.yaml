id: SYS-002
title: System shall render axial, sagittal, and coronal viewports simultaneously
category: Functional
content: 'Using Cornerstone3D, the system shall render three synchronized orthogonal

  viewports. Scrolling in one view shall update the crosshair position visible

  in all three views. Window/level changes shall apply globally across all

  viewports.

  The window-level tool shall offer the presets Soft Tissue, Lung, Bone, Brain, Mediastinum,
  Abdomen and Custom, apply the selected preset''s window width and level, and show
  the active values. Each axial, sagittal and coronal view shall show R/L/A/P/S/I
  markers on its four edges that are correct for the patient position of the series,
  so that left and right and head and foot can be told apart on a head-first or feet-first,
  supine or prone scan, and shall show the patient position (HFS, HFP, FFS, FFP).'
verification_method:
  - Test
  - Demonstration
testing: 'T1: Given a loaded series, three viewport panels labelled axial, sagittal,
  and coronal are visible on the workspace canvas.

  T2: Given a structure set is active, contour overlays are visible in the correct
  orthogonal plane for each viewport.

  T3: Given the window-level tool is active, the options bar lists the window-level
  presets and selecting one makes it the active preset and shows its window width
  and level.

  T4: Given a CT series loaded from the repository, each of the axial, sagittal and
  coronal viewports shows image data (not an empty view).

  T5: Given a CT series loaded from the repository, maximizing a planar viewport shows
  image data in it, and restoring the layout shows image data in all three planar
  views.

  T6: Given a CT series stored head-first supine, head-first prone, feet-first supine
  and feet-first prone, each 2D view shows the R/L/A/P/S/I markers and the patient
  position, and the markers agree with where known anatomy is drawn: the marker at
  the patient''s left and anterior, the spine at the posterior and the superior end.


  T7: Given the contour overlay of a planar view fails while it draws, that view shows
  a message that contours cannot be shown and that structures that exist are hidden,
  with a Retry control; pressing Retry draws the overlay again, and the message stays
  if it fails again.

  '
satisfies:
  - CRS-001
verification_criteria: 'With a series loaded, three viewport panels labelled axial,
  sagittal and coronal are visible; with a structure set active, contours appear in
  the correct plane in each; the window-level tool offers its presets, and selecting
  one makes it active and shows its window width and level; with a real CT series
  loaded, each of the three planar views shows image data, including after a viewport
  is maximized and the layout restored, and the maximized view shows image data. T6:
  for each of the four patient positions the markers read A/P/R/L (axial), S/I/R/L
  (coronal) and S/I/A/P (sagittal), the patient position is shown, and the left-anterior
  marker, the spine and the superior end are drawn where the letters say. T7: when
  the contour overlay of a view fails, the view says that contours cannot be shown,
  and Retry draws them again.'
