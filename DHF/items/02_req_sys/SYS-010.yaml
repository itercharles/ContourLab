id: SYS-010
title: System shall compute and display contour quality analysis for structures
category: Functional
content: |-
  The system shall analyze the active structure's contour geometry and report
  quality issues including open contours, degenerate contours with insufficient
  area, slice gaps larger than expected image spacing, abrupt adjacent-slice
  area or centroid changes, and contours outside the active image bounds. The
  system shall also aggregate quality issues across all structures into an RTSS
  QA checklist. Selecting a checklist item shall activate the corresponding
  structure and navigate to the relevant image slice.
verification_method:
  - Test
  - Demonstration
testing: 'T1: Given a structure with no contours, the quality analysis reports it
  as an empty informational item.

  T2: Given contours with open polygons, slice gaps larger than the image spacing
  or abrupt adjacent-slice area changes, the analysis reports each issue type.

  T3: Given abrupt adjacent-slice centroid shifts or contours outside the image bounds,
  the analysis reports centroid-jump and out-of-bounds issues.

  '
satisfies:
  - CRS-004
verification_criteria: Contour quality analysis runs for each structure; a structure
  with no contours is reported as an informational empty item. Open polygons, slice
  gaps, abrupt area changes, centroid jumps and out-of-bounds contours are each reported.
