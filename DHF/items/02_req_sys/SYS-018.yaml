id: SYS-018
title: System shall publish its services only on the interface of the workstation
  it runs on
category: Security
content: The deployed system (the web client server, the API and the DICOM repository)
  shall accept connections only from the workstation it runs on. None of them has
  authentication, so none shall be reachable from the network, and the web client
  server shall not forward requests to the DICOM repository's own REST interface,
  which can delete studies. To make the system available to other computers, an authenticating
  reverse proxy shall be placed in front of it; the bindings shall not be loosened.
verification_method:
- Inspection
satisfies:
- CRS-015
testing: 'T1: Given the deployment configuration, every published port is bound to
  the loopback interface and the web client server has no route to the repository
  REST interface.

  '
verification_criteria: docker-compose.deploy.yml and docker-compose.yml publish every
  port on 127.0.0.1, apps/client/nginx.conf has no /orthanc/ proxy, and the CI contract
  check that enforces both passes.
type: SYS
