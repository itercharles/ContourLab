project_name: "ContourLab"

# IEC 62304 §4.3 safety class declaration. Kept as a DHF record; medharness no
# longer reads these keys (removed in 0.31.0).
software_safety_class: "C"
classification_rationale: >
  ContourLab calculates radiation dose and delivers treatment plans directly to
  radiotherapy equipment. A software failure in dose calculation or plan delivery
  could result in over- or under-dose to the patient, causing serious injury or
  death. Class C applies per IEC 62304 §4.3(c).
